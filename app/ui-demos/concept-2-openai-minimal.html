<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice Intelligence - OpenAI Minimal</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap");

      :root {
        --bg: #0b0e11;
        --panel: #11161c;
        --panel-strong: #151b23;
        --border: rgba(148, 163, 184, 0.16);
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #22d3ee;
        --accent-2: #60a5fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
        background: radial-gradient(circle at 15% 20%, rgba(34, 211, 238, 0.12), transparent 45%),
          radial-gradient(circle at 80% 10%, rgba(96, 165, 250, 0.16), transparent 50%),
          var(--bg);
        color: var(--text);
      }

      .frame {
        max-width: 1080px;
        margin: 36px auto;
        padding: 24px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand .mark {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        display: grid;
        place-items: center;
        color: #021019;
        font-weight: 700;
      }

      .pill {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted);
      }

      .layout {
        display: grid;
        grid-template-columns: 1.2fr 0.9fr;
        gap: 18px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 18px;
      }

      .panel h2 {
        margin: 0 0 12px 0;
        font-size: 16px;
        letter-spacing: 0.2px;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        background: var(--panel-strong);
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.08);
      }

      select {
        background: transparent;
        border: 1px solid rgba(148, 163, 184, 0.2);
        color: var(--text);
        padding: 6px 10px;
        border-radius: 10px;
        min-width: 55%;
      }

      .record {
        margin: 16px 0;
        padding: 20px;
        border-radius: 16px;
        border: 1px solid rgba(148, 163, 184, 0.12);
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(17, 24, 39, 0.95));
        display: grid;
        place-items: center;
        gap: 12px;
      }

      .record button {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        border: none;
        background: linear-gradient(145deg, var(--accent), var(--accent-2));
        color: #021019;
        font-weight: 700;
      }

      .box {
        min-height: 140px;
        padding: 12px;
        border-radius: 14px;
        border: 1px solid rgba(148, 163, 184, 0.12);
        color: var(--muted);
      }

      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .chip {
        padding: 6px 10px;
        font-size: 12px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        color: var(--muted);
      }

      .chip.active {
        background: rgba(34, 211, 238, 0.18);
        color: var(--text);
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }

      .ghost {
        border: 1px solid rgba(148, 163, 184, 0.2);
        background: transparent;
        color: var(--text);
        padding: 8px 12px;
        border-radius: 10px;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <header>
        <div class="brand">
          <div class="mark">VI</div>
          <div>
            <div style="font-size: 20px; font-weight: 600">Voice Intelligence</div>
            <div style="font-size: 12px; color: var(--muted)">
              Hotkey: Ctrl/Cmd + Shift + Space
            </div>
          </div>
        </div>
        <div class="pill">WHISPER.CPP / OPENAI</div>
      </header>

      <div class="layout">
        <section class="panel">
          <h2>Capture</h2>
          <div class="row">
            <span style="font-size: 12px; color: var(--muted)">Microphone</span>
            <select>
              <option>System default</option>
              <option>USB Mic</option>
              <option>Studio Mic</option>
            </select>
          </div>
          <div class="record">
            <button>Record</button>
            <div style="font-size: 12px; color: var(--muted)">Local transcription on-device.</div>
          </div>
          <div class="box">No transcript yet.</div>
          <div class="actions">
            <button class="ghost">Copy</button>
            <button class="ghost">Clear</button>
          </div>
        </section>

        <section class="panel">
          <h2>Enrichment</h2>
          <div class="chips">
            <div class="chip active">Notes</div>
            <div class="chip">Summary</div>
            <div class="chip">Action Items</div>
            <div class="chip">Email</div>
          </div>
          <div style="height: 12px"></div>
          <div class="box">Structured output appears here.</div>
          <div class="actions">
            <button class="ghost">Copy output</button>
            <button class="ghost">Re-run</button>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
