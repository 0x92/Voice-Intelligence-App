<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice Intelligence - Studio Wave</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap");

      :root {
        --bg: #0b111a;
        --panel: #121a26;
        --panel-2: #172131;
        --border: rgba(148, 163, 184, 0.18);
        --text: #f8fafc;
        --muted: #9aa4b2;
        --accent: #22d3ee;
        --accent-2: #34d399;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Manrope", sans-serif;
        background: radial-gradient(circle at 20% 15%, rgba(34, 211, 238, 0.16), transparent 40%),
          radial-gradient(circle at 80% 80%, rgba(52, 211, 153, 0.16), transparent 45%),
          var(--bg);
        color: var(--text);
      }

      .wrap {
        max-width: 1100px;
        margin: 36px auto;
        padding: 24px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
      }

      .title {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .logo {
        width: 50px;
        height: 50px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        display: grid;
        place-items: center;
        color: #021016;
        font-weight: 700;
      }

      .pulse {
        font-family: "Space Mono", monospace;
        font-size: 12px;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted);
      }

      .layout {
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 18px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 20px;
      }

      .wave {
        height: 120px;
        border-radius: 16px;
        background: linear-gradient(180deg, rgba(34, 211, 238, 0.15), rgba(15, 23, 42, 0));
        border: 1px solid rgba(148, 163, 184, 0.12);
        display: flex;
        align-items: flex-end;
        gap: 6px;
        padding: 12px;
      }

      .wave span {
        width: 6px;
        border-radius: 999px;
        background: linear-gradient(180deg, var(--accent), var(--accent-2));
        animation: beat 1.4s ease-in-out infinite;
      }

      .wave span:nth-child(odd) {
        animation-delay: -0.4s;
      }

      @keyframes beat {
        0%,
        100% {
          height: 24px;
          opacity: 0.5;
        }
        50% {
          height: 90px;
          opacity: 1;
        }
      }

      .record {
        margin-top: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px 16px;
      }

      .record button {
        background: linear-gradient(145deg, var(--accent), var(--accent-2));
        border: none;
        padding: 10px 16px;
        border-radius: 12px;
        color: #021016;
        font-weight: 700;
      }

      .box {
        margin-top: 16px;
        min-height: 140px;
        padding: 12px;
        border-radius: 14px;
        background: var(--panel-2);
        border: 1px solid rgba(148, 163, 184, 0.12);
        color: var(--muted);
      }

      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .chip {
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        color: var(--muted);
        font-size: 12px;
      }

      .chip.active {
        background: rgba(34, 211, 238, 0.2);
        color: var(--text);
        border-color: rgba(34, 211, 238, 0.5);
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 12px;
      }

      .actions button {
        background: transparent;
        border: 1px solid rgba(148, 163, 184, 0.2);
        color: var(--text);
        padding: 8px 12px;
        border-radius: 10px;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="title">
          <div class="logo">VI</div>
          <div>
            <div style="font-size: 22px; font-weight: 700">Voice Intelligence</div>
            <div style="font-size: 12px; color: var(--muted)">
              Hotkey: Ctrl/Cmd + Shift + Space
            </div>
          </div>
        </div>
        <div class="pulse">LIVE STUDIO MODE</div>
      </header>

      <div class="layout">
        <section class="panel">
          <h2>Capture</h2>
          <div class="wave">
            <span style="height: 30px"></span>
            <span style="height: 70px"></span>
            <span style="height: 50px"></span>
            <span style="height: 90px"></span>
            <span style="height: 40px"></span>
            <span style="height: 80px"></span>
            <span style="height: 35px"></span>
          </div>
          <div class="record">
            <div>
              <div style="font-size: 12px; color: var(--muted)">Microphone</div>
              <div style="font-weight: 600">Studio Mic - Focusrite</div>
            </div>
            <button>Record</button>
          </div>
          <div class="box">No transcript yet. Start recording to capture.</div>
          <div class="actions">
            <button>Copy transcript</button>
            <button>Clear</button>
          </div>
        </section>

        <section class="panel">
          <h2>Enrichment</h2>
          <div class="chips">
            <div class="chip active">Notes</div>
            <div class="chip">Summary</div>
            <div class="chip">Action Items</div>
            <div class="chip">Email</div>
          </div>
          <div class="box">Your structured output appears here.</div>
          <div class="actions">
            <button>Copy output</button>
            <button>Re-run</button>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
