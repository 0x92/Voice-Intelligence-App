<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice Intelligence - Signal Neon</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Chivo:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap");

      :root {
        --bg: #05070c;
        --panel: #0c121c;
        --border: rgba(94, 234, 212, 0.15);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #5eead4;
        --accent-2: #38bdf8;
        --accent-3: #f59e0b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Chivo", sans-serif;
        background: radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.16), transparent 45%),
          radial-gradient(circle at 80% 70%, rgba(94, 234, 212, 0.18), transparent 40%),
          var(--bg);
        color: var(--text);
      }

      .frame {
        max-width: 1100px;
        margin: 34px auto;
        padding: 24px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .title {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .logo {
        width: 50px;
        height: 50px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        display: grid;
        place-items: center;
        color: #021017;
        font-weight: 700;
      }

      .meter {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--accent);
      }

      .layout {
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 18px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 18px;
        box-shadow: inset 0 0 0 1px rgba(94, 234, 212, 0.05);
      }

      .panel h2 {
        margin: 0 0 10px 0;
        font-size: 16px;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.5);
      }

      select {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
        padding: 6px 10px;
        border-radius: 10px;
      }

      .record {
        margin-top: 12px;
        border-radius: 16px;
        border: 1px dashed rgba(94, 234, 212, 0.35);
        padding: 18px;
        display: grid;
        place-items: center;
        gap: 10px;
      }

      .record button {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        border: none;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #021017;
        font-weight: 700;
        box-shadow: 0 0 20px rgba(94, 234, 212, 0.4);
      }

      .box {
        margin-top: 12px;
        min-height: 140px;
        padding: 12px;
        border-radius: 14px;
        border: 1px solid var(--border);
        color: var(--muted);
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 12px;
      }

      .chip.active {
        background: rgba(94, 234, 212, 0.18);
        color: var(--text);
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }

      .actions button {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
        padding: 8px 12px;
        border-radius: 10px;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <header>
        <div class="title">
          <div class="logo">VI</div>
          <div>
            <div style="font-size: 22px; font-weight: 700">Voice Intelligence</div>
            <div style="font-size: 12px; color: var(--muted)">
              Hotkey: Ctrl/Cmd + Shift + Space
            </div>
          </div>
        </div>
        <div class="meter">SIGNAL: STABLE</div>
      </header>

      <div class="layout">
        <section class="panel">
          <h2>Capture</h2>
          <div class="row">
            <span style="font-size: 12px; color: var(--muted)">Microphone</span>
            <select>
              <option>System default</option>
              <option>Studio Mic</option>
            </select>
          </div>
          <div class="record">
            <button>Record</button>
            <div style="font-size: 12px; color: var(--muted)">
              Local transcription, zero cloud latency.
            </div>
          </div>
          <div class="box">No transcript yet. Start recording to capture.</div>
          <div class="actions">
            <button>Copy transcript</button>
            <button>Clear</button>
          </div>
        </section>

        <section class="panel">
          <h2>Enrichment</h2>
          <div class="chips">
            <div class="chip active">Structured Notes</div>
            <div class="chip">Summary</div>
            <div class="chip">Action Items</div>
            <div class="chip">Email</div>
          </div>
          <div class="box">Your structured output will appear here.</div>
          <div class="actions">
            <button>Copy output</button>
            <button>Re-run</button>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
