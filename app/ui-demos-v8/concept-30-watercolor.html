<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Watercolor</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap');

        body {
            background-color: #fff;
            background-image: url('https://www.transparenttextures.com/patterns/watercolor.png');
            font-family: 'Amatic SC', cursive;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Simulated Watercolor Splashes */
        .splash {
            position: absolute;
            border-radius: 50%;
            filter: blur(10px);
            mix-blend-mode: multiply;
            z-index: 0;
        }
        .s1 { width: 400px; height: 400px; background: #ff99cc; top: -50px; left: -50px; opacity: 0.6; }
        .s2 { width: 500px; height: 500px; background: #99ccff; bottom: -100px; right: -50px; opacity: 0.5; }
        .s3 { width: 300px; height: 300px; background: #ffff99; top: 20%; right: 20%; opacity: 0.4; }

        .canvas-area {
            position: relative;
            z-index: 1;
            width: 600px;
            height: 400px;
            border: 4px solid #333;
            border-radius: 10px; /* Rough border simulated */
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 40px;
            text-align: center;
        }
        
        /* Rough border style */
        .canvas-area {
            border-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect x='5' y='5' width='90' height='90' fill='none' stroke='%23333' stroke-width='5' stroke-dasharray='10 5' /></svg>") 10;
        }

        h1 {
            font-size: 60px;
            margin: 0 0 20px 0;
            color: #444;
        }

        .mic-paint {
            width: 100px;
            height: 100px;
            margin: 0 auto;
            background: #ffaa99;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            cursor: pointer;
            box-shadow: 0 0 0 10px rgba(255, 170, 153, 0.3);
            transition: transform 0.3s;
        }

        .mic-paint:hover {
            transform: scale(1.1);
        }

        .transcript-line {
            font-size: 32px;
            margin-top: 30px;
            border-bottom: 2px dashed #ccc;
            padding-bottom: 10px;
            display: inline-block;
        }

        .palette {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        
        .color-dot {
            width: 30px; height: 30px; border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

    </style>
</head>
<body>
    <div class="splash s1"></div>
    <div class="splash s2"></div>
    <div class="splash s3"></div>

    <div class="canvas-area">
        <h1>Paint with your Voice</h1>
        
        <div class="mic-paint">🎙️</div>

        <div class="transcript-line">
            "Creative flow state..."
        </div>

        <div class="palette">
            <div class="color-dot" style="background: #ff99cc;"></div>
            <div class="color-dot" style="background: #99ccff;"></div>
            <div class="color-dot" style="background: #ffff99;"></div>
            <div class="color-dot" style="background: #ccff99;"></div>
        </div>
    </div>
</body>
</html>
