<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Isometric</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Varela+Round&display=swap');

        body {
            background-color: #f1f2f6;
            font-family: 'Varela Round', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .iso-scene {
            transform: rotateX(60deg) rotateZ(-45deg);
            transform-style: preserve-3d;
            width: 400px;
            height: 400px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 20px;
        }

        .block {
            background: #a4b0be;
            position: relative;
            transform-style: preserve-3d;
            width: 100%;
            height: 100%;
            transition: transform 0.3s;
            cursor: pointer;
        }

        .block::before {
            content: '';
            position: absolute;
            left: -20px;
            width: 20px;
            height: 100%;
            background: #747d8c;
            transform-origin: right;
            transform: skewY(-45deg);
        }

        .block::after {
            content: '';
            position: absolute;
            bottom: -20px;
            width: 100%;
            height: 20px;
            background: #ced6e0;
            transform-origin: top;
            transform: skewX(-45deg);
        }

        .block:hover {
            transform: translate(10px, -10px);
        }

        /* Specific block styles */
        .block-mic {
            background: #ff4757;
        }
        .block-mic::before { background: #c23616; }
        .block-mic::after { background: #ff6b81; }

        .block-text {
            background: #2ed573;
        }
        .block-text::before { background: #26af61; }
        .block-text::after { background: #7bed9f; }

        .block-settings {
            background: #1e90ff;
        }
        .block-settings::before { background: #1670bd; }
        .block-settings::after { background: #70a1ff; }

        .block-files {
            background: #ffa502;
        }
        .block-files::before { background: #cd8401; }
        .block-files::after { background: #ffbe76; }

        .icon {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotateZ(45deg);
            font-size: 40px;
            color: rgba(0,0,0,0.5);
            pointer-events: none;
        }

        .title-float {
            position: absolute;
            top: -100px;
            left: 50px;
            font-size: 40px;
            color: #2f3542;
            transform: translateZ(50px) rotateZ(45deg);
            text-transform: uppercase;
            font-weight: bold;
        }

        .shadow {
            position: absolute;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.2);
            filter: blur(20px);
            transform: translateZ(-20px);
            z-index: -1;
        }

    </style>
</head>
<body>
    <div class="iso-scene">
        <div class="title-float">IsoVoice</div>
        <div class="shadow"></div>

        <div class="block block-mic">
            <div class="icon">🎙️</div>
        </div>
        <div class="block block-text">
            <div class="icon">📄</div>
        </div>
        <div class="block block-files">
            <div class="icon">📁</div>
        </div>
        <div class="block block-settings">
            <div class="icon">⚙️</div>
        </div>
    </div>
</body>
</html>
