<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Deconstruct</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Helveti+Pixel&family=Syne:wght@700;800&display=swap');

        body {
            background-color: #fff;
            color: #000;
            font-family: 'Syne', sans-serif;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 1fr 1fr;
        }

        .big-text {
            font-size: 15vw;
            line-height: 0.8;
            font-weight: 800;
            position: absolute;
            top: -20px;
            left: -20px;
            z-index: 0;
            opacity: 0.1;
            pointer-events: none;
            word-break: break-all;
        }

        .panel {
            border: 1px solid #000;
            padding: 20px;
            position: relative;
        }

        .p1 {
            grid-column: 1;
            grid-row: 1;
            background: #ff0000;
            color: #fff;
            transform: rotate(-2deg);
            z-index: 2;
            margin: 20px;
        }

        .p2 {
            grid-column: 2;
            grid-row: 1 / span 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding-left: 100px;
            z-index: 1;
        }

        .p3 {
            grid-column: 3;
            grid-row: 2;
            background: #000;
            color: #fff;
            border-radius: 50%;
            width: 200px;
            height: 200px;
            display: grid;
            place-items: center;
            align-self: center;
            justify-self: center;
        }

        h1 {
            font-size: 80px;
            text-transform: uppercase;
            margin: 0;
            letter-spacing: -5px;
            background: yellow;
            padding: 0 20px;
            transform: skewX(-20deg);
        }

        .transcript-box {
            font-family: monospace;
            font-size: 24px;
            margin-top: 40px;
            border: 2px solid #000;
            padding: 20px;
            max-width: 400px;
            background: #fff;
            box-shadow: 10px 10px 0 #000;
        }

        .floating-img {
            position: absolute;
            width: 150px;
            height: 200px;
            background: url('https://images.unsplash.com/photo-1594904351111-a072f80b1a71?q=80&w=2535&auto=format&fit=crop');
            background-size: cover;
            top: 20%;
            right: 20%;
            z-index: 3;
            border: 1px solid #000;
        }

        .ticker {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            border-top: 2px solid #000;
            border-bottom: 2px solid #000;
            padding: 10px 0;
            font-family: monospace;
            white-space: nowrap;
            overflow: hidden;
            background: #fff;
        }

        .btn-raw {
            background: transparent;
            border: none;
            font-size: 30px;
            font-weight: 800;
            cursor: pointer;
            text-decoration: underline;
        }

    </style>
</head>
<body>
    <div class="big-text">VOICE<br>NOISE</div>
    
    <div class="panel p1">
        ERROR_LOG<br>
        // SYSTEM_READY<br>
        // MIC_CHECK_1_2
    </div>

    <div class="panel p2">
        <h1>Speak</h1>
        <h1>Now</h1>
        
        <div class="transcript-box">
            "Design is controlled chaos."
        </div>
    </div>

    <div class="panel p3">
        <button class="btn-raw" style="color: #fff;">REC</button>
    </div>

    <div class="floating-img"></div>

    <div class="ticker">
        /// LISTENING TO STREAM /// DO NOT ADJUST YOUR SET /// RAW INPUT DETECTED ///
    </div>
</body>
</html>
