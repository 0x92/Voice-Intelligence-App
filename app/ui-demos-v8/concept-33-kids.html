<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Kids</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap');

        body {
            background-color: #81ecec;
            font-family: 'Nunito', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Clouds background */
        .cloud {
            position: absolute;
            background: #fff;
            border-radius: 50px;
            z-index: 0;
        }
        .c1 { width: 200px; height: 100px; top: 10%; left: 10%; }
        .c2 { width: 150px; height: 80px; top: 20%; right: 15%; }
        .c3 { width: 300px; height: 120px; bottom: 10%; left: 20%; }

        .tablet {
            width: 600px;
            height: 450px;
            background: #ffeaa7;
            border-radius: 40px;
            border: 15px solid #fab1a0;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-shadow: 0 20px 0 rgba(0,0,0,0.1);
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 40px;
            color: #6c5ce7;
            margin: 10px 0 30px 0;
            text-shadow: 2px 2px 0 #fff;
        }

        .monster-mic {
            width: 150px;
            height: 150px;
            background: #a29bfe;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
            border: 5px solid #fff;
        }
        
        .monster-mic:hover { transform: scale(1.1) rotate(5deg); }

        .eye {
            width: 40px; height: 40px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 30px;
            left: 55px;
        }
        .pupil {
            width: 15px; height: 15px;
            background: #000;
            border-radius: 50%;
            position: absolute;
            top: 10px; right: 5px;
        }

        .mouth {
            width: 60px; height: 30px;
            background: #2d3436;
            border-radius: 0 0 30px 30px;
            position: absolute;
            bottom: 30px; left: 45px;
            overflow: hidden;
        }
        .tooth {
            width: 15px; height: 15px;
            background: #fff;
            border-radius: 0 0 5px 5px;
            position: absolute;
            top: 0; left: 10px;
        }

        .speech-bubble {
            background: #fff;
            padding: 20px;
            border-radius: 20px;
            margin-top: 30px;
            width: 80%;
            text-align: center;
            font-size: 20px;
            color: #2d3436;
            position: relative;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            top: -20px; left: 50%; transform: translateX(-50%);
            border-width: 0 20px 20px;
            border-style: solid;
            border-color: #fff transparent;
        }

        .buttons-row {
            margin-top: auto;
            display: flex;
            gap: 20px;
        }

        .big-btn {
            background: #55efc4;
            color: #00b894;
            border: none;
            padding: 15px 30px;
            border-radius: 20px;
            font-family: 'Fredoka One';
            font-size: 18px;
            cursor: pointer;
            border-bottom: 5px solid #00b894;
        }
        .big-btn:active { border-bottom: none; transform: translateY(5px); }

    </style>
</head>
<body>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>

    <div class="tablet">
        <h1>Talk to Me!</h1>
        
        <div class="monster-mic">
            <div class="eye"><div class="pupil"></div></div>
            <div class="mouth"><div class="tooth"></div></div>
        </div>

        <div class="speech-bubble">
            "Hi friend! Tell me a story!"
        </div>

        <div class="buttons-row">
            <button class="big-btn">Play</button>
            <button class="big-btn" style="background: #74b9ff; color: #0984e3; border-bottom-color: #0984e3;">Save</button>
        </div>
    </div>
</body>
</html>
