<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Luxury</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300&display=swap');

        body {
            background-color: #0a0a0a;
            color: #d4af37; /* Gold */
            font-family: 'Lato', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('https://www.transparenttextures.com/patterns/black-linen.png');
        }

        .card {
            width: 800px;
            height: 500px;
            background: #111;
            border: 1px solid #333;
            position: relative;
            display: flex;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .gold-border {
            position: absolute;
            top: 20px; left: 20px; right: 20px; bottom: 20px;
            border: 1px solid #d4af37;
            pointer-events: none;
        }

        .content {
            flex: 1;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 48px;
            letter-spacing: 5px;
            margin-bottom: 10px;
            color: #fff;
        }

        .subtitle {
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 12px;
            color: #d4af37;
            margin-bottom: 60px;
        }

        .mic-btn-lux {
            width: 80px; height: 80px;
            border-radius: 50%;
            border: 1px solid #d4af37;
            background: transparent;
            color: #d4af37;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.5s ease;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-btn-lux::before {
            content: '';
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%;
            border: 1px solid rgba(212, 175, 55, 0.3);
            transition: 0.5s;
        }

        .mic-btn-lux:hover {
            background: #d4af37;
            color: #000;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
        }

        .mic-btn-lux:hover::before {
            top: -15px; left: -15px; right: -15px; bottom: -15px;
            opacity: 0;
        }

        .wave-line {
            width: 100px;
            height: 1px;
            background: #d4af37;
            margin: 40px auto;
        }

        .status-text {
            font-size: 14px;
            font-weight: 300;
            color: #666;
        }

        .marble-texture {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1616048032770-51a843516641?q=80&w=2574&auto=format&fit=crop');
            opacity: 0.1;
            mix-blend-mode: overlay;
            pointer-events: none;
        }

    </style>
</head>
<body>
    <div class="card">
        <div class="marble-texture"></div>
        <div class="gold-border"></div>
        
        <div class="content">
            <h1>Aurum Voice</h1>
            <div class="subtitle">Premium Intelligence Suite</div>
            
            <div class="mic-btn-lux">
                <span style="font-family: 'Cinzel';">V</span>
            </div>

            <div class="wave-line"></div>
            
            <div class="status-text">
                Tap to initialize secure channel.
            </div>
        </div>
    </div>
</body>
</html>
