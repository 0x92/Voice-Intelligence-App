<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Synthwave</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Monoton&family=Orbitron:wght@400;900&display=swap');

        body {
            background-color: #0d0221;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
        }

        /* Sun and Grid Background */
        .sun {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: linear-gradient(to bottom, #ffea00, #ff0055);
            box-shadow: 0 0 40px #ff0055;
            z-index: 0;
            clip-path: polygon(0 0, 100% 0, 100% 60%, 0 60%, 0 65%, 100% 65%, 100% 70%, 0 70%, 0 75%, 100% 75%, 100% 80%, 0 80%, 0 85%, 100% 85%, 100% 100%, 0 100%);
        }

        .grid-floor {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 50%;
            background: 
                linear-gradient(rgba(255,0,255,0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,0,255,0.3) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(300px) rotateX(60deg);
            z-index: 1;
            box-shadow: 0 0 50px #ff0055 inset;
        }

        .mountains {
            position: absolute;
            bottom: 40%;
            width: 100%;
            height: 200px;
            background: #0d0221;
            clip-path: polygon(0 100%, 15% 40%, 30% 100%, 45% 60%, 60% 100%, 75% 30%, 90% 100%, 100% 100%);
            z-index: 1;
        }

        .ui-container {
            z-index: 10;
            width: 600px;
            text-align: center;
            background: rgba(13, 2, 33, 0.7);
            padding: 40px;
            border: 2px solid #00f3ff;
            box-shadow: 0 0 20px #00f3ff, inset 0 0 20px #00f3ff;
            border-radius: 10px;
            position: relative;
        }

        h1 {
            font-family: 'Monoton', cursive;
            font-size: 60px;
            color: #ff00de;
            text-shadow: 2px 2px 0px #00f3ff;
            margin: 0 0 20px 0;
            font-weight: 400;
        }

        .viz-bars {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 10px;
            height: 100px;
            margin-bottom: 30px;
        }

        .bar {
            width: 20px;
            background: linear-gradient(to top, #ff00de, #00f3ff);
            height: 20px;
            box-shadow: 0 0 10px #ff00de;
        }

        .btn-retro {
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            padding: 15px 40px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.2s;
            position: relative;
            overflow: hidden;
        }

        .btn-retro:hover {
            background: #fff;
            color: #0d0221;
            box-shadow: 0 0 20px #fff;
        }

        .btn-retro::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            transition: 0.5s;
        }
        .btn-retro:hover::before { left: 100%; }

    </style>
</head>
<body>
    <div class="sun"></div>
    <div class="mountains"></div>
    <div class="grid-floor"></div>

    <div class="ui-container">
        <h1>RAD VOICE</h1>
        
        <div class="viz-bars">
            <div class="bar" style="height: 40%"></div>
            <div class="bar" style="height: 80%"></div>
            <div class="bar" style="height: 60%"></div>
            <div class="bar" style="height: 90%"></div>
            <div class="bar" style="height: 30%"></div>
            <div class="bar" style="height: 70%"></div>
            <div class="bar" style="height: 50%"></div>
        </div>

        <button class="btn-retro">Start Recording</button>
    </div>

    <script>
        const bars = document.querySelectorAll('.bar');
        setInterval(() => {
            bars.forEach(bar => {
                bar.style.height = Math.floor(Math.random() * 80 + 20) + '%';
            });
        }, 100);
    </script>
</body>
</html>
