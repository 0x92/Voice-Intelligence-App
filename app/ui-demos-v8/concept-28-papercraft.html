<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Papercraft</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');

        body {
            background-color: #f0e6d2;
            font-family: 'Patrick Hand', cursive;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .paper-layer {
            background: #fff;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            position: relative;
        }

        .base {
            width: 500px;
            height: 600px;
            transform: rotate(-2deg);
            z-index: 1;
        }

        .header-fold {
            width: 100%;
            height: 100px;
            background: #ff6b6b;
            position: absolute;
            top: 0;
            left: 0;
            clip-path: polygon(0 0, 100% 0, 100% 80%, 50% 100%, 0 80%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
            z-index: 2;
        }

        .content-area {
            padding: 120px 40px 40px 40px;
            font-size: 24px;
            color: #555;
            line-height: 1.6;
        }

        .mic-button {
            width: 80px; height: 80px;
            background: #4ecdc4;
            position: absolute;
            bottom: 40px; right: 40px;
            clip-path: polygon(20% 0%, 80% 0%, 100% 20%, 100% 80%, 80% 100%, 20% 100%, 0% 80%, 0% 20%);
            display: grid;
            place-items: center;
            color: white;
            font-size: 40px;
            cursor: pointer;
            transition: transform 0.2s;
            z-index: 3;
            box-shadow: 5px 5px 0 rgba(0,0,0,0.1);
        }
        
        .mic-button:hover { transform: scale(1.1) rotate(5deg); }

        .sticky-note {
            width: 150px;
            height: 150px;
            background: #ffe66d;
            position: absolute;
            top: 200px; right: -60px;
            transform: rotate(5deg);
            padding: 20px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.1);
            font-size: 18px;
            z-index: 4;
        }

        .crease {
            position: absolute;
            width: 100%; height: 1px;
            background: rgba(0,0,0,0.05);
            top: 300px;
            transform: rotate(1deg);
        }

        .pencil {
            position: absolute;
            left: -80px; top: 100px;
            width: 20px; height: 300px;
            background: #fab1a0;
            transform: rotate(-10deg);
            border-radius: 10px;
            box-shadow: 5px 5px 10px rgba(0,0,0,0.1);
        }

    </style>
</head>
<body>
    <div class="paper-layer base">
        <div class="header-fold">Origami Voice</div>
        
        <div class="content-area">
            <p>Unfold your ideas.</p>
            <p>Just tap the button and speak. We'll capture every word on this digital paper.</p>
        </div>

        <div class="crease"></div>

        <div class="sticky-note">
            Don't forget to buy milk!
        </div>

        <div class="mic-button">🎙️</div>
    </div>

    <div class="pencil"></div>
</body>
</html>
