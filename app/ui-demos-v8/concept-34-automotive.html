<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Automotive</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Racing+Sans+One&family=Roboto:wght@400;700&display=swap');

        body {
            background-color: #111;
            color: #fff;
            font-family: 'Roboto', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dashboard-screen {
            width: 800px;
            height: 400px;
            background: radial-gradient(#222, #000);
            border: 4px solid #333;
            border-radius: 40px;
            display: grid;
            grid-template-columns: 250px 1fr 250px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        .cluster {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .gauge-ring {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 10px solid #222;
            border-top: 10px solid #e74c3c;
            border-right: 10px solid #e74c3c;
            transform: rotate(-45deg);
            position: relative;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.2);
        }

        .center-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        h2 {
            font-family: 'Racing Sans One', cursive;
            font-size: 32px;
            margin: 0;
            text-transform: uppercase;
            font-style: italic;
        }

        .visualizer-road {
            width: 100%;
            height: 100px;
            perspective: 200px;
            margin-top: 20px;
            overflow: hidden;
        }
        
        .road-grid {
            width: 100%;
            height: 200%;
            background: linear-gradient(#000 50%, transparent 50%), linear-gradient(90deg, transparent 48%, #e74c3c 50%, transparent 52%);
            background-size: 40px 40px;
            transform: rotateX(60deg);
            animation: drive 1s linear infinite;
        }

        @keyframes drive { from { transform: rotateX(60deg) translateY(0); } to { transform: rotateX(60deg) translateY(40px); } }

        .btn-sport {
            background: linear-gradient(#e74c3c, #c0392b);
            border: none;
            color: #fff;
            padding: 10px 40px;
            font-weight: bold;
            font-size: 18px;
            border-radius: 30px;
            margin-top: 20px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }

        .status-pill {
            background: #333;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 10px;
            color: #ccc;
        }

        .temp {
            position: absolute;
            bottom: 20px; right: 40px; font-size: 24px; font-weight: bold;
        }
        .time {
            position: absolute;
            bottom: 20px; left: 40px; font-size: 24px; font-weight: bold;
        }

    </style>
</head>
<body>
    <div class="dashboard-screen">
        <div class="cluster">
            <div class="gauge-ring"></div>
            <div style="position: absolute; font-size: 40px; font-weight: bold;">0</div>
            <div style="position: absolute; bottom: 60px; font-size: 12px; color: #888;">MPH</div>
        </div>

        <div class="center-display">
            <div class="status-pill">LISTENING...</div>
            <h2>Voice Command</h2>
            
            <div class="visualizer-road">
                <div class="road-grid"></div>
            </div>

            <button class="btn-sport">Navigate Home</button>
        </div>

        <div class="cluster">
            <div class="gauge-ring" style="border-color: #222; border-left: 10px solid #3498db; border-top: 10px solid #3498db;"></div>
            <div style="position: absolute; font-size: 24px; font-weight: bold;">240</div>
            <div style="position: absolute; bottom: 60px; font-size: 12px; color: #888;">RANGE</div>
        </div>

        <div class="time">12:45</div>
        <div class="temp">72°F</div>
    </div>
</body>
</html>
