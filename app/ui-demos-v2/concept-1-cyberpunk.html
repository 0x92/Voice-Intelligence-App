<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Cyberpunk</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --bg: #050505;
            --grid: #1a1a1a;
            --primary: #ff0055;
            --secondary: #00e5ff;
            --text: #e0e0e0;
            --glass: rgba(10, 10, 10, 0.9);
        }

        body {
            background-color: var(--bg);
            background-image: 
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text);
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: var(--glass);
            border: 1px solid var(--secondary);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
            padding: 20px;
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            box-shadow: 0 0 10px var(--secondary);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed var(--secondary);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px var(--primary);
        }

        .status {
            color: var(--secondary);
            font-size: 14px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            border: 1px solid #333;
            padding: 15px;
            background: rgba(0,0,0,0.5);
            position: relative;
        }

        .panel-header {
            background: var(--primary);
            color: #000;
            padding: 5px 10px;
            display: inline-block;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-size: 12px;
        }

        .visualizer {
            height: 60px;
            display: flex;
            align-items: flex-end;
            gap: 4px;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .bar {
            flex: 1;
            background: var(--secondary);
            height: 10%;
            box-shadow: 0 0 5px var(--secondary);
            animation: pulse 1s infinite ease-in-out;
        }
        .bar:nth-child(odd) { animation-duration: 0.8s; }
        .bar:nth-child(even) { animation-duration: 1.2s; }

        @keyframes pulse {
            0%, 100% { height: 10%; opacity: 0.5; }
            50% { height: 80%; opacity: 1; }
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 10px 20px;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px var(--primary);
        }

        button.secondary {
            border-color: var(--secondary);
            color: var(--secondary);
        }
        button.secondary:hover {
            background: var(--secondary);
            color: #000;
            box-shadow: 0 0 15px var(--secondary);
        }

        .output-area {
            height: 200px;
            border: 1px solid #333;
            padding: 10px;
            overflow-y: auto;
            color: var(--secondary);
            font-size: 14px;
            background: rgba(0,0,0,0.8);
        }

        .glitch-text {
            position: relative;
        }
        
        /* Scanline effect */
        .scanlines {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="container">
        <header>
            <h1>NEURO_VOICE // v2.0</h1>
            <div class="status">SYSTEM: ONLINE_</div>
        </header>

        <div class="main-grid">
            <div class="panel">
                <div class="panel-header">Input Stream</div>
                <div class="visualizer">
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                </div>
                <div class="controls">
                    <button>REC [R]</button>
                    <button class="secondary">PAUSE</button>
                </div>
                <p style="font-size: 12px; color: #666; margin-top: 15px;">Mic: FOCUSRITE_USB_AUDIO_DEVICE</p>
            </div>

            <div class="panel">
                <div class="panel-header">Processing Core</div>
                <div style="margin-bottom: 10px; display: flex; gap: 10px;">
                    <button class="secondary" style="font-size: 10px; padding: 5px 10px;">SUMMARIZE</button>
                    <button class="secondary" style="font-size: 10px; padding: 5px 10px;">TRANSLATE</button>
                    <button class="secondary" style="font-size: 10px; padding: 5px 10px;">CODE_EXTRACT</button>
                </div>
                <div class="output-area">
                    > Waiting for voice input...<br>
                    > Model loaded: Whisper-large-v3<br>
                    > Ready.<span style="animation: blink 1s infinite">_</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
