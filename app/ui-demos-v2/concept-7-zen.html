<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Zen</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&display=swap');

        body {
            background: #fafafa;
            color: #111;
            font-family: 'Lora', serif;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .paper {
            width: 600px;
            min-height: 800px;
            background: #fff;
            padding: 60px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        h1 {
            font-weight: 500;
            font-size: 24px;
            margin-bottom: 40px;
            letter-spacing: -0.5px;
            text-align: center;
            opacity: 0.8;
        }

        .content {
            font-size: 18px;
            line-height: 1.8;
            color: #333;
        }

        .content p {
            margin-bottom: 24px;
        }

        .cursor {
            display: inline-block;
            width: 1px;
            height: 18px;
            background: #000;
            animation: blink 1s infinite;
            vertical-align: middle;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .footer {
            margin-top: auto;
            border-top: 1px solid #eee;
            padding-top: 20px;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .action {
            background: none;
            border: none;
            font-family: 'Lora', serif;
            font-style: italic;
            color: #999;
            cursor: pointer;
            font-size: 14px;
            transition: color 0.3s;
        }

        .action:hover {
            color: #000;
        }

        .action.active {
            color: #000;
            border-bottom: 1px solid #000;
        }

    </style>
</head>
<body>
    <div class="paper">
        <h1>Untitled Thought</h1>
        
        <div class="content">
            <p>The best ideas often come in silence. But sometimes, speaking them out loud gives them shape.</p>
            <p>This is a space for clarity. Just speak, and the words will flow onto the page, unburdened by distraction.</p>
            <p><span class="cursor"></span></p>
        </div>

        <div class="footer">
            <button class="action active">Record</button>
            <button class="action">Pause</button>
            <button class="action">Refine</button>
        </div>
    </div>
</body>
</html>
