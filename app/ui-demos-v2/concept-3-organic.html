<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Organic</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap');

        :root {
            --bg: #e8efe6;
            --surface: rgba(255, 255, 255, 0.6);
            --primary: #5c8d89;
            --accent: #f0a07c;
            --text: #4a4a4a;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Nunito', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Abstract blobs background */
        .blob {
            position: absolute;
            filter: blur(40px);
            z-index: -1;
            opacity: 0.8;
        }
        .blob-1 { top: -10%; left: -10%; width: 500px; height: 500px; background: #c5e1d4; border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; animation: morph 10s infinite; }
        .blob-2 { bottom: -10%; right: -10%; width: 400px; height: 400px; background: #f4dcd6; border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; animation: morph 12s infinite; }

        @keyframes morph {
            0%, 100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
            34% { border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%; }
            67% { border-radius: 100% 60% 60% 100% / 100% 100% 60% 60%; }
        }

        .card {
            width: 800px;
            height: 500px;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.8);
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 250px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.5);
        }

        .main {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
        }

        h2 {
            margin: 0 0 30px 0;
            font-weight: 800;
            color: var(--primary);
            font-size: 24px;
        }

        .nav-item {
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .nav-item.active {
            background: #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            color: var(--primary);
        }

        .nav-item:hover:not(.active) {
            background: rgba(255,255,255,0.4);
        }

        .mic-btn {
            width: 80px;
            height: 80px;
            background: var(--accent);
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(240, 160, 124, 0.4);
            margin: auto;
            display: grid;
            place-items: center;
            transition: transform 0.2s;
        }

        .mic-btn:hover {
            transform: scale(1.05);
        }

        .content {
            background: #fff;
            flex: 1;
            border-radius: 30px;
            padding: 25px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.02);
            color: #666;
            line-height: 1.6;
            overflow-y: auto;
        }
        
        .pill {
            display: inline-block;
            padding: 5px 15px;
            background: #e0f2f1;
            color: #00695c;
            border-radius: 50px;
            font-size: 12px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="card">
        <div class="sidebar">
            <h2>Natural<br>Voice</h2>
            
            <div class="nav-item active">New Note</div>
            <div class="nav-item">Journal</div>
            <div class="nav-item">Ideas</div>

            <div style="margin-top: auto; text-align: center;">
                <p style="font-size: 12px; margin-bottom: 10px;">Tap to speak</p>
                <button class="mic-btn">🎙</button>
            </div>
        </div>
        <div class="main">
            <div style="margin-bottom: 15px;">
                <span class="pill">Thinking...</span>
            </div>
            <div class="content">
                <p>Today was a productive day. I need to remember to buy groceries on the way home, specifically milk and bread. Also, the meeting with the design team went well.</p>
                <p style="opacity: 0.5;">[Listening...]</p>
            </div>
        </div>
    </div>
</body>
</html>
