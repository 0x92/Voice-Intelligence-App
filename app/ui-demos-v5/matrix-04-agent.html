<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Agent Vision</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');

        body {
            background-color: #051505;
            color: #00ff00;
            font-family: 'Courier Prime', monospace;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Green tint overlay */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(0, 50, 0, 0.2), rgba(0, 50, 0, 0.2));
            z-index: 0;
            pointer-events: none;
        }

        .hud-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hud-corner {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 4px solid #00ff00;
            opacity: 0.6;
        }
        .tl { top: 20px; left: 20px; border-right: 0; border-bottom: 0; }
        .tr { top: 20px; right: 20px; border-left: 0; border-bottom: 0; }
        .bl { bottom: 20px; left: 20px; border-right: 0; border-top: 0; }
        .br { bottom: 20px; right: 20px; border-left: 0; border-top: 0; }

        .scan-line {
            position: absolute;
            top: 0; left: 0; right: 0; height: 10px;
            background: rgba(0, 255, 0, 0.3);
            box-shadow: 0 0 10px #00ff00;
            animation: scan 3s linear infinite;
            z-index: 10;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .target-box {
            border: 2px dashed #00ff00;
            width: 600px;
            height: 400px;
            margin: auto;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 20, 0, 0.4);
        }

        .target-box::after {
            content: '+';
            position: absolute;
            font-size: 40px;
            opacity: 0.5;
        }

        .data-block {
            position: absolute;
            font-size: 12px;
            background: #002200;
            padding: 5px;
            border: 1px solid #00ff00;
        }

        .db-1 { top: -20px; left: 0; }
        .db-2 { bottom: -20px; right: 0; }

        .scrolling-code {
            position: absolute;
            right: 40px;
            top: 150px;
            width: 200px;
            height: 300px;
            overflow: hidden;
            font-size: 10px;
            opacity: 0.7;
            text-align: right;
            line-height: 1.2;
        }

        .freq-visualizer {
            position: absolute;
            left: 40px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .freq-bar {
            width: 50px;
            height: 4px;
            background: #00ff00;
            opacity: 0.5;
        }

        .status-text {
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 5px;
            animation: blink 1s infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

    </style>
</head>
<body>
    <div class="scan-line"></div>
    <div class="hud-wrapper">
        <div class="hud-corner tl"></div>
        <div class="hud-corner tr"></div>
        <div class="hud-corner bl"></div>
        <div class="hud-corner br"></div>

        <div class="freq-visualizer">
            <div class="freq-bar" style="width: 80px"></div>
            <div class="freq-bar" style="width: 40px"></div>
            <div class="freq-bar" style="width: 120px"></div>
            <div class="freq-bar" style="width: 60px"></div>
            <div class="freq-bar" style="width: 90px"></div>
            <div class="freq-bar" style="width: 30px"></div>
            <div class="freq-bar" style="width: 100px"></div>
        </div>

        <div class="scrolling-code">
            0F 2A 4C 99<br>
            MATCH FOUND<br>
            VOICE_PRINT_ID: 8842<br>
            ANALYZING SYNTAX...<br>
            PROBABILITY: 99.9%<br>
            ANOMALY DETECTED<br>
            RE-ROUTING...<br>
            00 11 00 11
        </div>

        <div class="target-box">
            <div class="data-block db-1">TARGET: AUDIO_INPUT</div>
            <div class="data-block db-2">STATUS: LOCKED</div>
            
            <div class="status-text">ACQUIRING SIGNAL</div>
            <div style="margin-top: 20px; font-size: 12px;">"Mr. Anderson..."</div>
        </div>
    </div>
</body>
</html>
