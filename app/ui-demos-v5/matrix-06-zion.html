<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Zion Control</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@300;500;700&display=swap');

        body {
            background-color: #0c0a08; /* Rusty dark */
            color: #d68c45; /* Amber/Rust */
            font-family: 'Teko', sans-serif;
            margin: 0;
            height: 100vh;
            display: grid;
            grid-template-rows: 60px 1fr 40px;
            overflow: hidden;
            background-image: repeating-linear-gradient(45deg, #15110d 0, #15110d 10px, #0c0a08 10px, #0c0a08 20px);
        }

        header {
            background: #2b2018;
            border-bottom: 2px solid #5a4030;
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
            font-size: 28px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .status-light {
            width: 15px; height: 15px;
            background: #ff4400;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff4400;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        main {
            display: grid;
            grid-template-columns: 300px 1fr;
            padding: 20px;
            gap: 20px;
        }

        .panel {
            background: rgba(43, 32, 24, 0.8);
            border: 1px solid #5a4030;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .grid-display {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-bottom: 20px;
        }

        .grid-cell {
            background: #1a1410;
            height: 40px;
            border: 1px solid #33221a;
        }
        .grid-cell.active { background: #d68c45; box-shadow: 0 0 10px #d68c45; }

        .big-meter {
            width: 100%;
            height: 200px;
            border: 2px solid #5a4030;
            position: relative;
            background: #000;
            display: flex;
            align-items: flex-end;
            padding: 5px;
            gap: 5px;
        }

        .meter-bar {
            flex: 1;
            background: #d68c45;
            transition: height 0.1s;
        }

        h2 { margin: 0 0 10px 0; font-weight: 300; letter-spacing: 1px; color: #a67c52; }

        .industrial-btn {
            background: #3e2e22;
            border: 2px solid #5a4030;
            color: #d68c45;
            padding: 15px;
            font-size: 24px;
            text-transform: uppercase;
            cursor: pointer;
            font-family: 'Teko', sans-serif;
            margin-top: 10px;
        }
        .industrial-btn:hover { background: #d68c45; color: #000; }

        footer {
            background: #1a1410;
            border-top: 1px solid #33221a;
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 18px;
            color: #664433;
        }

    </style>
</head>
<body>
    <header>
        <div>Zion Mainframe Access</div>
        <div style="display: flex; align-items: center; gap: 10px; font-size: 18px;">
            LEVEL 5 AUTHORIZATION <div class="status-light"></div>
        </div>
    </header>

    <main>
        <div class="panel">
            <h2>Dock Status</h2>
            <div class="grid-display">
                <div class="grid-cell active"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell active"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell active"></div><div class="grid-cell"></div>
            </div>
            
            <h2>APU Units</h2>
            <div style="font-size: 24px;">ONLINE: 340<br>OFFLINE: 12</div>

            <div style="margin-top: auto;">
                <button class="industrial-btn">Open Gate 3</button>
            </div>
        </div>

        <div class="panel">
            <h2>Audio Frequency Analysis</h2>
            <div class="big-meter" id="meter">
                <div class="meter-bar" style="height: 20%"></div>
                <div class="meter-bar" style="height: 50%"></div>
                <div class="meter-bar" style="height: 80%"></div>
                <div class="meter-bar" style="height: 30%"></div>
                <div class="meter-bar" style="height: 60%"></div>
                <div class="meter-bar" style="height: 40%"></div>
                <div class="meter-bar" style="height: 90%"></div>
                <div class="meter-bar" style="height: 20%"></div>
                <div class="meter-bar" style="height: 50%"></div>
                <div class="meter-bar" style="height: 70%"></div>
            </div>

            <div style="margin-top: 20px; font-size: 24px; border: 1px dashed #5a4030; padding: 10px;">
                INCOMING TRANSMISSION:<br>
                "We need more time. The machines are digging."
            </div>
        </div>
    </main>

    <footer>
        System Uptime: 4892 Hours | Temperature: 34°C | Core: Stable
    </footer>

    <script>
        const bars = document.querySelectorAll('.meter-bar');
        setInterval(() => {
            bars.forEach(bar => {
                bar.style.height = Math.floor(Math.random() * 100) + '%';
            });
        }, 100);
    </script>
</body>
</html>
