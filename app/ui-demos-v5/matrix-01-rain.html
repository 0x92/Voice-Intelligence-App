<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Matrix Rain</title>
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            z-index: 0;
        }

        .interface {
            position: relative;
            z-index: 1;
            width: 800px;
            background: rgba(0, 20, 0, 0.85);
            border: 1px solid #0f0;
            padding: 20px;
            box-shadow: 0 0 20px #0f0;
        }

        .header {
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 1px solid #0f0;
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }

        .waveform {
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            margin-bottom: 20px;
            border: 1px solid #004400;
            background: #001100;
        }

        .bar {
            width: 4px;
            background: #0f0;
            height: 10px;
            box-shadow: 0 0 5px #0f0;
            animation: wave 1s infinite ease-in-out;
        }

        @keyframes wave {
            0%, 100% { height: 10px; opacity: 0.5; }
            50% { height: 80px; opacity: 1; }
        }

        .text-output {
            font-size: 18px;
            line-height: 1.5;
            min-height: 150px;
            color: #ccffcc;
            text-shadow: 0 0 2px #0f0;
        }

        .btn {
            background: #000;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 10px 20px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 15px #0f0;
        }

        .glitch {
            animation: glitch 1s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

    </style>
</head>
<body>
    <canvas id="matrix"></canvas>

    <div class="interface">
        <div class="header">
            <span>> SYSTEM_DECRYPT</span>
            <span style="font-size: 14px;">v2.0.1</span>
        </div>

        <div class="waveform">
            <div class="bar" style="animation-delay: 0.0s"></div>
            <div class="bar" style="animation-delay: 0.1s"></div>
            <div class="bar" style="animation-delay: 0.2s"></div>
            <div class="bar" style="animation-delay: 0.3s"></div>
            <div class="bar" style="animation-delay: 0.4s"></div>
            <div class="bar" style="animation-delay: 0.5s"></div>
            <div class="bar" style="animation-delay: 0.6s"></div>
            <div class="bar" style="animation-delay: 0.7s"></div>
            <div class="bar" style="animation-delay: 0.8s"></div>
            <div class="bar" style="animation-delay: 0.9s"></div>
            <div class="bar" style="animation-delay: 0.1s"></div>
            <div class="bar" style="animation-delay: 0.2s"></div>
            <div class="bar" style="animation-delay: 0.3s"></div>
            <div class="bar" style="animation-delay: 0.4s"></div>
            <div class="bar" style="animation-delay: 0.5s"></div>
            <div class="bar" style="animation-delay: 0.6s"></div>
            <div class="bar" style="animation-delay: 0.7s"></div>
            <div class="bar" style="animation-delay: 0.8s"></div>
            <div class="bar" style="animation-delay: 0.9s"></div>
            <div class="bar" style="animation-delay: 0.0s"></div>
        </div>

        <div class="text-output">
            > Detecting audio input signal...<br>
            > Signal strength: 98%<br>
            > Pattern matching...<br>
            > "Wake up, Neo..."
        </div>

        <div style="margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px;">
            <button class="btn">Jack In</button>
            <button class="btn">Disconnect</button>
        </div>
    </div>

    <script>
        // Simple Matrix Rain Effect
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789@#$%^&*()*&^%';
        const fontSize = 16;
        const columns = canvas.width / fontSize;

        const drops = [];
        for (let x = 0; x < columns; x++) {
            drops[x] = 1;
        }

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(draw, 33);
    </script>
</body>
</html>
