<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Choice</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 50px;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .hands {
            display: flex;
            gap: 100px;
            justify-content: center;
        }

        .hand-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s;
            cursor: pointer;
        }
        
        .hand-col:hover {
            transform: scale(1.1);
        }

        .pill {
            width: 40px;
            height: 80px;
            border-radius: 20px;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.5), 0 0 20px rgba(255,255,255,0.2);
            margin-bottom: 20px;
            position: relative;
        }
        
        /* Gloss */
        .pill::after {
            content: '';
            position: absolute;
            top: 10px; left: 10px; width: 10px; height: 30px;
            background: rgba(255,255,255,0.8);
            border-radius: 5px;
        }

        .blue {
            background: radial-gradient(circle at 30% 30%, #4444ff, #0000aa);
            box-shadow: 0 0 30px #0000ff;
        }

        .red {
            background: radial-gradient(circle at 30% 30%, #ff4444, #aa0000);
            box-shadow: 0 0 30px #ff0000;
        }

        .reflection-floor {
            height: 100px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.1), transparent);
            margin-top: 50px;
            transform: perspective(500px) rotateX(60deg);
            width: 600px;
            margin-left: auto; margin-right: auto;
            border-radius: 50%;
            filter: blur(20px);
        }

        .description {
            max-width: 200px;
            font-size: 12px;
            line-height: 1.5;
            color: #aaa;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .hand-col:hover .description { opacity: 1; }

        .mic-active {
            margin-top: 40px;
            font-size: 14px;
            color: #666;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>The Choice</h1>

        <div class="hands">
            <div class="hand-col">
                <div class="pill blue"></div>
                <div class="description">
                    The story ends. You wake up in your bed and believe whatever you want to believe.<br>
                    (Exit App)
                </div>
            </div>

            <div class="hand-col">
                <div class="pill red"></div>
                <div class="description">
                    You stay in Wonderland, and I show you how deep the rabbit hole goes.<br>
                    (Start Recording)
                </div>
            </div>
        </div>

        <div class="reflection-floor"></div>

        <div class="mic-active">
            Waiting for voice command...
        </div>
    </div>
</body>
</html>
