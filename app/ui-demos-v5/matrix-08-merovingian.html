<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Merovingian</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital@0;1&display=swap');

        body {
            background-color: #1a0505;
            color: #d4af37; /* Gold */
            font-family: 'Playfair Display', serif;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(#300 15%, transparent 16%),
                radial-gradient(#300 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
        }

        .card {
            width: 700px;
            min-height: 500px;
            background: linear-gradient(135deg, #2a0a0a, #1a0505);
            border: 2px solid #d4af37;
            padding: 40px;
            box-shadow: 0 20px 50px #000;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Ornate corners */
        .corner {
            position: absolute;
            width: 40px; height: 40px;
            border: 2px solid #d4af37;
        }
        .tl { top: 10px; left: 10px; border-right: none; border-bottom: none; }
        .tr { top: 10px; right: 10px; border-left: none; border-bottom: none; }
        .bl { bottom: 10px; left: 10px; border-right: none; border-top: none; }
        .br { bottom: 10px; right: 10px; border-left: none; border-top: none; }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 36px;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            border-bottom: 1px solid #d4af37;
            padding-bottom: 20px;
            width: 80%;
        }

        .quote {
            font-style: italic;
            font-size: 18px;
            color: #b08d55;
            margin-bottom: 40px;
        }

        .visualizer-container {
            width: 100%;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            background: rgba(0,0,0,0.2);
        }

        .silk-wave {
            width: 6px;
            background: #d4af37;
            border-radius: 3px;
            height: 20px;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            animation: elegance 2s infinite ease-in-out;
        }

        @keyframes elegance {
            0%, 100% { height: 20px; }
            50% { height: 80px; }
        }

        .btn-elegant {
            background: transparent;
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 15px 40px;
            font-family: 'Cinzel', serif;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-elegant:hover {
            background: rgba(212, 175, 55, 0.1);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        .wine-glass {
            position: absolute;
            bottom: 20px;
            right: 40px;
            font-size: 40px;
            opacity: 0.5;
        }

    </style>
</head>
<body>
    <div class="card">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

        <h1>Cause and Effect</h1>
        <p class="quote">"I drink too much wine, I must pee. Cause and effect."</p>

        <div class="visualizer-container">
            <!-- Elegant waves -->
            <div class="silk-wave" style="animation-delay: 0s"></div>
            <div class="silk-wave" style="animation-delay: 0.2s"></div>
            <div class="silk-wave" style="animation-delay: 0.4s"></div>
            <div class="silk-wave" style="animation-delay: 0.6s"></div>
            <div class="silk-wave" style="animation-delay: 0.8s"></div>
            <div class="silk-wave" style="animation-delay: 1.0s"></div>
            <div class="silk-wave" style="animation-delay: 0.3s"></div>
        </div>

        <div style="margin-bottom: 20px;">
            <p>Speak, if you must. But do try to be... interesting.</p>
        </div>

        <button class="btn-elegant">Transcribe</button>
        
        <div class="wine-glass">🍷</div>
    </div>
</body>
</html>
