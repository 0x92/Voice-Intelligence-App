<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Architect</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;500&display=swap');

        body {
            background-color: #fff;
            color: #000;
            font-family: 'Roboto Mono', monospace;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .wall-of-screens {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 100%;
            height: 100%;
            gap: 2px;
            background: #000;
        }

        .screen {
            background: #fff;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .screen.main {
            grid-column: 2 / span 3;
            grid-row: 2;
            z-index: 10;
            border: 5px solid #000;
        }

        .code-snippet {
            font-size: 8px;
            color: #000;
            opacity: 0.5;
            position: absolute;
            top: 0; left: 0;
            white-space: pre;
        }

        .face-placeholder {
            width: 80%;
            height: 80%;
            border: 1px solid #ccc;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #aaa;
        }

        .control-ui {
            text-align: center;
            padding: 40px;
        }

        h1 {
            font-size: 24px;
            text-transform: uppercase;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .equation {
            font-style: italic;
            margin-bottom: 30px;
        }

        .vis-lines {
            display: flex;
            gap: 2px;
            height: 50px;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
        }

        .v-line {
            width: 2px;
            background: #000;
            height: 10px;
            animation: architect-wave 0.5s infinite alternate;
        }

        @keyframes architect-wave { from { height: 10px; } to { height: 40px; } }

    </style>
</head>
<body>
    <div class="wall-of-screens">
        <!-- Background screens -->
        <div class="screen"><div class="code-snippet">ERR: 404</div></div>
        <div class="screen"><div class="code-snippet">SYS.REBOOT</div></div>
        <div class="screen"><div class="code-snippet">VAR X = 0</div></div>
        <div class="screen"><div class="code-snippet">IF (NEO)</div></div>
        <div class="screen"><div class="code-snippet">RETURN NULL</div></div>
        
        <div class="screen"><div class="code-snippet">LOOP</div></div>
        <!-- Main Screen -->
        <div class="screen main">
            <div class="control-ui">
                <h1>Ergo</h1>
                <div class="equation">Vis-à-vis. Concordantly.</div>
                <p style="font-size: 12px; max-width: 400px; margin: 0 auto;">
                    You are here because you wish to transcribe audio. A systemic anomaly inherent to the programming of the voice interface.
                </p>
                
                <div class="vis-lines">
                    <div class="v-line" style="animation-delay: 0.1s"></div>
                    <div class="v-line" style="animation-delay: 0.2s"></div>
                    <div class="v-line" style="animation-delay: 0.3s"></div>
                    <div class="v-line" style="animation-delay: 0.4s"></div>
                    <div class="v-line" style="animation-delay: 0.5s"></div>
                    <div class="v-line" style="animation-delay: 0.2s"></div>
                    <div class="v-line" style="animation-delay: 0.1s"></div>
                </div>
            </div>
        </div>

        <div class="screen"><div class="code-snippet">END</div></div>
        
        <div class="screen"><div class="code-snippet">CHOICE</div></div>
        <div class="screen"><div class="code-snippet">MATRIX v6</div></div>
        <div class="screen"><div class="code-snippet">ZION</div></div>
        <div class="screen"><div class="code-snippet">SMITH</div></div>
        <div class="screen"><div class="code-snippet">LOVE</div></div>
    </div>
</body>
</html>
