<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Sentinel</title>
    <style>
        body {
            background-color: #000;
            color: #f00;
            font-family: monospace;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Many red eyes effect */
        .background-eyes {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            opacity: 0.3;
        }
        
        .eye {
            position: absolute;
            width: 10px; height: 10px;
            background: #f00;
            border-radius: 50%;
            box-shadow: 0 0 20px #f00;
            animation: swarm 10s infinite ease-in-out;
        }

        @keyframes swarm {
            0% { transform: translate(0, 0); }
            50% { transform: translate(20px, 20px); }
            100% { transform: translate(0, 0); }
        }

        .main-vision {
            width: 800px;
            height: 600px;
            border-radius: 50%;
            border: 2px solid #300;
            position: relative;
            background: radial-gradient(circle, transparent 30%, #000 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 100px #300;
        }

        .reticle {
            position: absolute;
            width: 300px;
            height: 300px;
            border: 1px solid rgba(255, 0, 0, 0.5);
            border-radius: 50%;
            animation: spin-slow 20s linear infinite;
        }
        .reticle::before {
            content: '';
            position: absolute;
            top: -10px; left: 50%; transform: translateX(-50%);
            width: 2px; height: 20px; background: #f00;
        }

        @keyframes spin-slow { 100% { transform: rotate(360deg); } }

        .waveform-ring {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            border: 1px dashed #f00;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.9); opacity: 0.5; }
            50% { transform: scale(1.0); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.5; }
        }

        .data-overlay {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #f00;
            text-shadow: 0 0 5px #f00;
        }

        .hex-grid {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 0 L40 10 L40 30 L20 40 L0 30 L0 10 Z' fill='none' stroke='%23300' stroke-width='1'/%3E%3C/svg%3E");
            opacity: 0.2;
            pointer-events: none;
        }

        .scan-bar {
            position: absolute;
            top: 0; left: 0; right: 0; height: 5px;
            background: #f00;
            box-shadow: 0 0 20px #f00;
            animation: scan-vertical 2s linear infinite;
        }

        @keyframes scan-vertical {
            0% { top: 10%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 90%; opacity: 0; }
        }

    </style>
</head>
<body>
    <div class="background-eyes">
        <!-- JS would generate these, hardcoding a few for demo -->
        <div class="eye" style="top: 10%; left: 20%;"></div>
        <div class="eye" style="top: 80%; left: 80%;"></div>
        <div class="eye" style="top: 30%; left: 70%;"></div>
        <div class="eye" style="top: 60%; left: 10%;"></div>
    </div>

    <div class="main-vision">
        <div class="hex-grid"></div>
        <div class="scan-bar"></div>
        <div class="reticle"></div>
        <div class="waveform-ring"></div>
        
        <div class="data-overlay">
            SEARCHING...<br>
            <span style="font-size: 24px;">NO HUMAN DETECTED</span><br>
            AUDIO SENSOR: ACTIVE
        </div>
    </div>
</body>
</html>
