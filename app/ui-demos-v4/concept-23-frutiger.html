<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Frutiger Aero</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Trebuchet+MS&display=swap');

        body {
            margin: 0;
            height: 100vh;
            font-family: 'Trebuchet MS', sans-serif;
            background: linear-gradient(180deg, #87CEFA 0%, #E0F7FA 50%, #FFFFFF 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Abstract Aurora/Gloss background elements */
        .aurora {
            position: absolute;
            top: 0; left: 0; right: 0; height: 100%;
            background: url('https://img.freepik.com/free-vector/abstract-green-light-curved-lines_1017-25121.jpg?w=1380&t=st=1706600000~exp=1706600600~hmac=abc'); /* Placeholder or CSS gradient */
            background: radial-gradient(circle at 50% -20%, rgba(255,255,255,0.8), transparent 70%),
                        linear-gradient(to bottom right, #7FDBFF, #01FF70);
            opacity: 0.3;
            z-index: -1;
        }

        .window-frame {
            width: 700px;
            height: 450px;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255,255,255,0.9);
            border-radius: 15px;
            box-shadow: 
                0 10px 30px rgba(0, 100, 200, 0.2),
                inset 0 1px 0 rgba(255,255,255,1);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
        }

        .title-bar {
            height: 35px;
            background: linear-gradient(to bottom, #E6F4FF, #CDE5FE);
            border-radius: 14px 14px 0 0;
            border-bottom: 1px solid #A0B0C0;
            display: flex;
            align-items: center;
            padding: 0 15px;
            font-size: 14px;
            color: #333;
            text-shadow: 0 1px 0 #fff;
            box-shadow: inset 0 1px 0 #fff;
        }

        .controls {
            margin-left: auto;
            display: flex;
            gap: 5px;
        }
        .win-btn {
            width: 20px; height: 20px;
            border-radius: 3px;
            border: 1px solid #8899AA;
            background: linear-gradient(#fff, #ddd);
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .close { background: linear-gradient(#fcc, #f88); border-color: #c66; }

        .content {
            flex: 1;
            padding: 30px;
            display: flex;
            gap: 20px;
        }

        .sidebar {
            width: 150px;
            background: linear-gradient(to right, #F0F8FF, #FFFFFF);
            border: 1px solid #B0C4DE;
            border-radius: 5px;
            padding: 10px;
        }

        .main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .orb-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 30%, #aaffff, #0088cc);
            box-shadow: 
                0 5px 15px rgba(0, 100, 200, 0.4),
                inset 0 5px 10px rgba(255,255,255,0.8),
                inset 0 -10px 20px rgba(0,0,50,0.2);
            border: 2px solid #fff;
            cursor: pointer;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .orb-button::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 20px;
            right: 20px;
            height: 40px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.9), rgba(255,255,255,0.1));
            border-radius: 50%;
        }

        .gloss-text {
            margin-top: 20px;
            color: #004488;
            font-size: 18px;
            text-shadow: 0 1px 0 #fff;
        }

    </style>
</head>
<body>
    <div class="aurora"></div>

    <div class="window-frame">
        <div class="title-bar">
            <img src="https://cdn-icons-png.flaticon.com/512/3659/3659738.png" width="16" style="margin-right:8px; opacity:0.8;">
            Voice Assistant 2007
            <div class="controls">
                <div class="win-btn"></div>
                <div class="win-btn"></div>
                <div class="win-btn close"></div>
            </div>
        </div>
        
        <div class="content">
            <div class="sidebar">
                <div style="color: #0066cc; margin-bottom: 5px;">Tasks</div>
                <hr style="border:0; border-top:1px solid #B0C4DE; margin-bottom:10px;">
                <div style="font-size: 13px; color: #444; line-height: 1.8;">
                    • Record Audio<br>
                    • Dictate Text<br>
                    • Configure Mic<br>
                </div>
            </div>

            <div class="main-view">
                <div class="orb-button">
                    <span style="font-weight: bold; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.3); font-size: 18px; z-index: 2;">REC</span>
                </div>
                <div class="gloss-text">Click the orb to start.</div>
            </div>
        </div>
    </div>
</body>
</html>
