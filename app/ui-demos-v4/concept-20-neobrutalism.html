<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Neo-Brutalism</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@700;800&display=swap');

        body {
            background-color: #A390E4; /* Pastel Purple */
            font-family: 'Public Sans', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: #fff;
            border: 4px solid #000;
            box-shadow: 12px 12px 0 #000;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        h1 {
            font-size: 48px;
            text-transform: uppercase;
            margin: 0;
            line-height: 0.9;
            text-shadow: 2px 2px 0 #ddd;
        }

        .tag {
            background: #FF90E8; /* Pink */
            color: #000;
            border: 3px solid #000;
            padding: 5px 15px;
            font-size: 14px;
            display: inline-block;
            transform: rotate(-2deg);
            width: fit-content;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .box {
            background: #90F1EF; /* Cyan */
            border: 4px solid #000;
            padding: 20px;
            box-shadow: 6px 6px 0 #000;
            transition: all 0.1s;
        }

        .box:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0 #000;
        }

        .box:active {
            transform: translate(2px, 2px);
            box-shadow: 4px 4px 0 #000;
        }

        button {
            width: 100%;
            padding: 20px;
            background: #FFD23F; /* Yellow */
            border: 4px solid #000;
            font-weight: 800;
            font-size: 20px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 8px 8px 0 #000;
            transition: all 0.1s;
        }

        button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 10px 10px 0 #000;
        }

        button:active {
            transform: translate(4px, 4px);
            box-shadow: 4px 4px 0 #000;
        }

        .output {
            background: #000;
            color: #fff;
            padding: 20px;
            font-family: monospace;
            font-size: 16px;
            min-height: 100px;
            border: 4px solid #000;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="tag">BETA v0.9</div>
        <h1>Voice<br>Recorder.</h1>
        
        <div class="output">
            > Ready to capture audio...
        </div>

        <div class="controls">
            <div class="box">
                <strong>MODE:</strong><br>
                DICTATION
            </div>
            <div class="box" style="background: #F0F0F0;">
                <strong>FORMAT:</strong><br>
                RAW TEXT
            </div>
        </div>

        <button>Start Recording</button>
    </div>
</body>
</html>
