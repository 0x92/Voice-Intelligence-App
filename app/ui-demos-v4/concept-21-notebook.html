<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Notebook</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Kalam:wght@400;700&display=swap');

        body {
            background-color: #555;
            background-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png');
            font-family: 'Kalam', cursive;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .notebook {
            width: 600px;
            min-height: 700px;
            background: #fdfbf7;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
            position: relative;
            padding: 40px 60px 40px 80px;
            background-image: linear-gradient(#e1e1e1 1px, transparent 1px);
            background-size: 100% 30px;
            line-height: 30px;
            color: #2c3e50;
            font-size: 22px;
            border-radius: 4px;
        }

        .notebook::before {
            content: '';
            position: absolute;
            top: 0; bottom: 0; left: 40px;
            width: 2px;
            background: #ff9999;
        }

        .title {
            font-family: 'Caveat', cursive;
            font-size: 42px;
            color: #d35400;
            margin-bottom: 20px;
            transform: rotate(-2deg);
        }

        .text-content {
            margin-top: 30px;
        }

        .pencil {
            position: absolute;
            right: -40px;
            top: 100px;
            width: 20px;
            height: 400px;
            background: #f1c40f;
            border-radius: 10px;
            box-shadow: 5px 5px 10px rgba(0,0,0,0.2);
            transform: rotate(5deg);
        }
        
        .pencil::before {
            content: '';
            position: absolute;
            top: -20px; left: 0; width: 20px; height: 20px;
            background: #e74c3c;
            border-radius: 5px 5px 0 0;
        }

        .sticker {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            background: #2ecc71;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #fff;
            font-weight: bold;
            transform: rotate(15deg);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            cursor: pointer;
            font-family: sans-serif;
            font-size: 14px;
            text-align: center;
        }
        
        .sticker:active { transform: rotate(15deg) scale(0.95); }

    </style>
</head>
<body>
    <div class="notebook">
        <h1 class="title">My Voice Notes</h1>
        
        <div class="text-content">
            <p>Dear Diary,</p>
            <p>Today I had a great idea for the new app. I should just speak it out loud and let the computer write it down for me.</p>
            <p>It feels so much more natural than typing...</p>
            <p style="color: #999;">[ Listening... ]</p>
        </div>

        <div class="sticker">TAP TO<br>REC</div>
        <div class="pencil"></div>
    </div>
</body>
</html>
