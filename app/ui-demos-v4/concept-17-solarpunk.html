<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Solarpunk</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap');

        :root {
            --leaf: #4a6c42;
            --sun: #f7d061;
            --sky: #a3d9ff;
            --cream: #fffdf5;
            --wood: #8b5a2b;
        }

        body {
            background-color: var(--cream);
            color: var(--leaf);
            font-family: 'Josefin Sans', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(247, 208, 97, 0.2) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(74, 108, 66, 0.1) 0%, transparent 30%);
        }

        .panel {
            width: 700px;
            min-height: 500px;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid var(--sun);
            border-radius: 40px 40px 40px 0;
            box-shadow: 0 10px 40px rgba(74, 108, 66, 0.15);
            padding: 40px;
            position: relative;
            backdrop-filter: blur(5px);
        }

        h1 {
            font-weight: 300;
            font-size: 36px;
            margin: 0 0 30px 0;
            color: var(--wood);
        }

        .vine-border {
            position: absolute;
            top: -20px;
            right: -20px;
            width: 100px;
            height: 100px;
            border-top: 5px solid var(--leaf);
            border-right: 5px solid var(--leaf);
            border-radius: 0 50px 0 0;
        }
        
        .vine-leaf {
            position: absolute;
            background: var(--leaf);
            width: 20px; height: 10px;
            border-radius: 20px 0;
        }

        .transcript-area {
            background: rgba(255,255,255,0.6);
            border-radius: 20px;
            padding: 20px;
            min-height: 200px;
            border: 1px dashed var(--leaf);
            font-size: 18px;
            line-height: 1.6;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .btn-organic {
            width: 60px;
            height: 60px;
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            border: none;
            background: linear-gradient(135deg, var(--sun), #e6b800);
            color: var(--wood);
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(247, 208, 97, 0.4);
            transition: all 0.3s ease;
            animation: breathe 4s infinite ease-in-out;
            display: grid;
            place-items: center;
        }

        .btn-organic:hover {
            border-radius: 50%;
            transform: scale(1.1);
        }

        @keyframes breathe {
            0%, 100% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; }
            50% { border-radius: 70% 30% 30% 70% / 70% 70% 30% 30%; }
        }

        .energy-stats {
            position: absolute;
            bottom: 20px;
            right: 40px;
            font-size: 12px;
            color: var(--wood);
            opacity: 0.7;
        }

    </style>
</head>
<body>
    <div class="panel">
        <div class="vine-border">
            <div class="vine-leaf" style="top: 20px; right: -5px; transform: rotate(30deg);"></div>
            <div class="vine-leaf" style="top: -5px; right: 20px; transform: rotate(-30deg);"></div>
        </div>
        
        <h1>Harmonic Voice Interface</h1>
        
        <div class="transcript-area">
            Using technology to bring us closer to nature. The systems are running on renewable energy. Voice data is processed locally to preserve privacy and energy.
        </div>

        <div class="controls">
            <button class="btn-organic">☀</button>
        </div>

        <div class="energy-stats">
            Solar Input: 98% • Efficiency: High
        </div>
    </div>
</body>
</html>
