<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Claymorphism</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap');

        body {
            background-color: #f0f4f8;
            font-family: 'Fredoka', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .clay-card {
            width: 400px;
            background: #fff;
            border-radius: 40px;
            padding: 40px;
            /* Clay Effect: Multiple inset and outset shadows */
            box-shadow: 
                30px 30px 60px #cdd2d9, 
                -30px -30px 60px #ffffff,
                inset 10px 10px 20px rgba(0,0,0,0.02),
                inset -10px -10px 20px rgba(255,255,255,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            color: #6c7a89;
            font-size: 28px;
            margin-bottom: 30px;
        }

        .clay-btn-large {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: #ff7675;
            border: none;
            color: white;
            font-size: 40px;
            cursor: pointer;
            box-shadow: 
                16px 16px 32px rgba(163, 177, 198, 0.4), 
                -16px -16px 32px #ffffff,
                inset 4px 4px 8px rgba(255,255,255,0.2),
                inset -4px -4px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .clay-btn-large:active {
            transform: scale(0.95);
            box-shadow: 
                8px 8px 16px rgba(163, 177, 198, 0.4), 
                -8px -8px 16px #ffffff;
        }

        .bubble {
            background: #74b9ff;
            color: #fff;
            padding: 20px;
            border-radius: 20px;
            margin-top: 40px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 
                8px 8px 16px rgba(163, 177, 198, 0.3), 
                -8px -8px 16px #ffffff,
                inset 2px 2px 4px rgba(255,255,255,0.2);
            position: relative;
        }

        .bubble::after {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 0 10px 10px;
            border-style: solid;
            border-color: #74b9ff transparent;
            display: block;
            width: 0;
        }

    </style>
</head>
<body>
    <div class="clay-card">
        <h2>Hi, Buddy!</h2>
        
        <button class="clay-btn-large">
            🎙️
        </button>

        <div class="bubble">
            I'm ready when you are! Just tap the big button and tell me what's on your mind.
        </div>
    </div>
</body>
</html>
