<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - E-Ink</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bitter:wght@400;700&display=swap');

        body {
            background-color: #f4f4f4;
            color: #111;
            font-family: 'Bitter', serif;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .device-frame {
            width: 500px;
            height: 700px;
            background: #333;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            position: relative;
        }

        .screen {
            background: #e8e8e8; /* E-ink base color */
            width: 100%;
            height: 100%;
            border-radius: 5px;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Simulate E-ink ghosting/texture */
        .screen::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.5' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
            opacity: 0.6;
            pointer-events: none;
        }

        header {
            padding: 15px;
            border-bottom: 2px solid #111;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 18px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .battery {
            font-size: 12px;
            border: 1px solid #111;
            padding: 2px 5px;
        }

        .page-content {
            padding: 30px;
            flex: 1;
        }

        .text-line {
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .controls-area {
            background: #fff;
            border-top: 2px solid #111;
            padding: 20px;
            display: flex;
            justify-content: space-around;
        }

        .e-btn {
            background: #fff;
            border: 2px solid #111;
            border-radius: 30px;
            padding: 10px 25px;
            font-family: inherit;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 2px 2px 0 #111;
        }
        
        .e-btn:active {
            box-shadow: none;
            transform: translate(2px, 2px);
            background: #000;
            color: #fff;
        }

        .e-btn.primary {
            background: #111;
            color: #fff;
        }

        /* Refresh flash animation */
        .refresh-flash {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            opacity: 0;
            pointer-events: none;
            animation: refresh 0.5s ease-out;
        }

        @keyframes refresh {
            0% { opacity: 0; }
            50% { opacity: 0.8; }
            100% { opacity: 0; }
        }

    </style>
</head>
<body>
    <div class="device-frame">
        <div class="screen">
            <div class="refresh-flash"></div>
            <header>
                <h1>Remarkable Voice</h1>
                <div class="battery">98%</div>
            </header>
            
            <div class="page-content">
                <div class="text-line">Chapter 1: The Beginning</div>
                <div class="text-line">The idea was simple: a device that listens as well as it reads. No distractions. Just pure text.</div>
                <div class="text-line" style="color: #666;">[Waiting for dictation...]</div>
            </div>

            <div class="controls-area">
                <button class="e-btn">Menu</button>
                <button class="e-btn primary">Record</button>
                <button class="e-btn">Save</button>
            </div>
        </div>
    </div>
</body>
</html>
