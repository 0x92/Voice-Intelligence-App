<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Holographic</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&display=swap');

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Syncopate', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card {
            width: 600px;
            height: 400px;
            position: relative;
            background: rgba(20, 20, 20, 0.6);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        /* Iridescent / Holographic Effect */
        .card::before {
            content: '';
            position: absolute;
            top: -150%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 40%,
                rgba(255, 0, 255, 0.2) 45%,
                rgba(0, 255, 255, 0.2) 50%,
                rgba(255, 255, 0, 0.2) 55%,
                transparent 60%
            );
            transform: rotate(30deg);
            animation: shine 6s linear infinite;
            pointer-events: none;
        }

        @keyframes shine {
            0% { transform: translateY(0) rotate(30deg); }
            100% { transform: translateY(50%) rotate(30deg); }
        }

        h1 {
            font-weight: 700;
            font-size: 32px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff00cc, #3333ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .visualizer-ring {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.1);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.2);
        }

        .visualizer-ring::after {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #ff00cc, #3333ff, #00ccff, #ff00cc);
            z-index: -1;
            filter: blur(10px);
            animation: spin 4s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .mic-icon {
            font-size: 40px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        .status {
            margin-top: 40px;
            font-size: 12px;
            letter-spacing: 4px;
            color: rgba(255,255,255,0.6);
        }

        .grain {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            opacity: 0.5;
            pointer-events: none;
        }

    </style>
</head>
<body>
    <div class="card">
        <div class="grain"></div>
        <h1>Prism.Voice</h1>
        
        <div class="visualizer-ring">
            <div class="mic-icon">◉</div>
        </div>

        <div class="status">LISTENING</div>
    </div>
</body>
</html>
