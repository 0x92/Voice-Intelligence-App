<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - DEFCON</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;700;900&display=swap');

        body {
            background-color: #0d0d0d;
            color: #ccc;
            font-family: 'Big Shoulders Display', sans-serif;
            margin: 0;
            height: 100vh;
            display: grid;
            grid-template-rows: 80px 1fr;
            overflow: hidden;
            text-transform: uppercase;
        }

        header {
            background: #1a1a1a;
            border-bottom: 4px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        .title { font-size: 36px; font-weight: 900; letter-spacing: 2px; }
        .defcon-level {
            font-size: 48px;
            font-weight: 900;
            color: #ff0000;
            text-shadow: 0 0 20px #ff0000;
            animation: pulse-alert 2s infinite;
        }

        @keyframes pulse-alert { 0% { opacity: 0.8; } 50% { opacity: 1; text-shadow: 0 0 30px #ff0000; } 100% { opacity: 0.8; } }

        main {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 4px;
            background: #333;
            padding: 4px;
        }

        .panel {
            background: #151515;
            padding: 20px;
            position: relative;
        }

        .panel-header {
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-size: 24px;
            color: #888;
            display: flex;
            justify-content: space-between;
        }

        .large-number {
            font-size: 80px;
            font-weight: 900;
            color: #fff;
            line-height: 1;
        }
        
        .sub-stat { font-size: 18px; color: #555; }

        .map-grid {
            width: 100%;
            height: 200px;
            background-image: 
                linear-gradient(#333 1px, transparent 1px),
                linear-gradient(90deg, #333 1px, transparent 1px);
            background-size: 20px 20px;
            position: relative;
        }

        .target {
            width: 20px; height: 20px;
            border: 2px solid #ff0000;
            border-radius: 50%;
            position: absolute;
            top: 40%; left: 60%;
            animation: ping 1s infinite;
        }

        @keyframes ping { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }

        .audio-stream {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 100px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        .bar {
            width: 100%;
            background: #ffcc00;
            height: 10px;
            transition: height 0.1s;
        }

    </style>
</head>
<body>
    <header>
        <div class="title">Strategic Command</div>
        <div class="defcon-level">DEFCON 2</div>
    </header>

    <main>
        <div class="panel">
            <div class="panel-header">Active Threats</div>
            <div class="large-number" style="color: #ff3333">04</div>
            <div class="sub-stat">ICBM LAUNCH DETECTED</div>
        </div>

        <div class="panel">
            <div class="panel-header">Global Comms</div>
            <div class="audio-stream" id="stream">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
            <div style="margin-top: 10px; color: #ffcc00;">RECORDING PRIORITY CHANNEL...</div>
        </div>

        <div class="panel">
            <div class="panel-header">Readiness</div>
            <div class="large-number">92%</div>
            <div class="sub-stat">Silos Operational</div>
        </div>

        <div class="panel" style="grid-column: span 2;">
            <div class="panel-header">Targeting Vector</div>
            <div class="map-grid">
                <div class="target"></div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">Auth Codes</div>
            <div style="font-family: monospace; font-size: 24px; letter-spacing: 5px; color: #555;">
                ****-****-AF92
            </div>
            <button style="margin-top: 20px; width: 100%; padding: 15px; background: #333; border: none; color: #fff; font-family: inherit; font-size: 20px; cursor: pointer;">VERIFY VOICE PRINT</button>
        </div>
    </main>

    <script>
        setInterval(() => {
            document.querySelectorAll('.bar').forEach(b => b.style.height = Math.random() * 100 + '%');
        }, 100);
    </script>
</body>
</html>
