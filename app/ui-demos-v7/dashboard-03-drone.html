<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Drone</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap');

        body {
            background-color: #050a0f;
            color: #00aaff;
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .hud-header {
            height: 60px;
            border-bottom: 1px solid rgba(0, 170, 255, 0.3);
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
            background: rgba(0, 20, 40, 0.5);
        }

        .main-view {
            flex: 1;
            display: flex;
            position: relative;
            background-image: 
                linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)),
                url('https://images.unsplash.com/photo-1473862170180-84427c485aca?q=80&w=2670&auto=format&fit=crop'); /* Aerial view placeholder */
            background-size: cover;
            background-position: center;
        }

        .overlay-grid {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(0, 170, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 170, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        .side-panel {
            width: 300px;
            background: rgba(0, 10, 20, 0.9);
            border-left: 1px solid rgba(0, 170, 255, 0.3);
            display: flex;
            flex-direction: column;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .stat-box {
            border: 1px solid rgba(0, 170, 255, 0.3);
            margin-bottom: 20px;
            padding: 15px;
        }

        .stat-label {
            font-size: 10px;
            color: rgba(0, 170, 255, 0.6);
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
        }

        .audio-vis {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
        }
        
        .spec-bar {
            width: 4px;
            background: #00aaff;
            height: 10%;
            animation: fluctuate 0.5s infinite alternate;
        }

        @keyframes fluctuate { from { height: 10%; } to { height: 90%; } }

        .reticle-center {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100px; height: 100px;
            border: 1px solid rgba(0, 170, 255, 0.5);
            border-radius: 50%;
        }
        
        .reticle-center::before, .reticle-center::after {
            content: ''; position: absolute; background: rgba(0, 170, 255, 0.5);
        }
        .reticle-center::before { top: 50%; left: -20px; right: -20px; height: 1px; }
        .reticle-center::after { left: 50%; top: -20px; bottom: -20px; width: 1px; }

        .rec-indicator {
            width: 10px; height: 10px; background: red; border-radius: 50%;
            display: inline-block; margin-right: 5px;
            box-shadow: 0 0 10px red;
            animation: blink 1s infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

    </style>
</head>
<body>
    <div class="hud-header">
        <div>UAV-09 RECON</div>
        <div>ALT: 4,200 FT</div>
        <div>SPD: 120 KTS</div>
        <div><span class="rec-indicator"></span>LIVE FEED</div>
    </div>

    <div class="main-view">
        <div class="overlay-grid"></div>
        <div class="reticle-center"></div>
        
        <div style="flex: 1;"></div>

        <div class="side-panel">
            <div class="stat-box">
                <div class="stat-label">BATTERY</div>
                <div class="stat-value">64%</div>
            </div>
            
            <div class="stat-box">
                <div class="stat-label">SIGNAL STRENGTH</div>
                <div class="stat-value">98 dBm</div>
            </div>

            <div class="stat-box">
                <div class="stat-label">AUDIO INTERCEPT</div>
                <div class="audio-vis">
                    <div class="spec-bar" style="animation-delay: 0s"></div>
                    <div class="spec-bar" style="animation-delay: 0.1s"></div>
                    <div class="spec-bar" style="animation-delay: 0.2s"></div>
                    <div class="spec-bar" style="animation-delay: 0.3s"></div>
                    <div class="spec-bar" style="animation-delay: 0.1s"></div>
                    <div class="spec-bar" style="animation-delay: 0.4s"></div>
                    <div class="spec-bar" style="animation-delay: 0.2s"></div>
                    <div class="spec-bar" style="animation-delay: 0.0s"></div>
                </div>
                <div style="font-size: 12px; margin-top: 5px;">"Pattern matched: Human Voice"</div>
            </div>
        </div>
    </div>
</body>
</html>
