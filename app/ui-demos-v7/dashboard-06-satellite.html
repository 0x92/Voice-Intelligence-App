<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Satellite</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Saira:wght@400;600&display=swap');

        body {
            background-color: #080808;
            color: #dbe4eb;
            font-family: 'Saira', sans-serif;
            margin: 0;
            height: 100vh;
            display: grid;
            grid-template-columns: 80px 1fr 350px;
            overflow: hidden;
        }

        .nav-rail {
            background: #111;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            gap: 20px;
        }

        .icon-btn {
            width: 50px; height: 50px;
            background: #222;
            border: 1px solid #444;
            display: grid;
            place-items: center;
            font-size: 20px;
            color: #888;
            cursor: pointer;
        }
        .icon-btn:hover, .icon-btn.active { background: #0077ff; color: #fff; border-color: #0077ff; }

        .main-stage {
            position: relative;
            background: #000;
            overflow: hidden;
        }

        .globe-wireframe {
            width: 600px;
            height: 600px;
            border: 1px solid rgba(0, 119, 255, 0.3);
            border-radius: 50%;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, #001133 0%, #000 70%);
        }

        .orbit-path {
            position: absolute;
            top: 50%; left: 50%;
            width: 800px; height: 300px;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
        }

        .satellite {
            width: 20px; height: 20px;
            background: #fff;
            position: absolute;
            top: 0; left: 50%;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff;
        }

        .info-panel {
            background: #111;
            border-left: 1px solid #333;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 20px;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
        }

        h2 { margin: 0; font-family: 'Saira Stencil One', sans-serif; font-size: 24px; color: #0077ff; }

        .data-row {
            padding: 15px 20px;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
        }

        .label { color: #666; font-size: 12px; text-transform: uppercase; }
        .value { font-weight: 600; font-family: monospace; }

        .terminal {
            flex: 1;
            background: #000;
            padding: 20px;
            font-family: monospace;
            font-size: 12px;
            color: #00ff88;
            overflow-y: auto;
            border-top: 1px solid #333;
        }

        .mic-interface {
            padding: 20px;
            background: #1a1a1a;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
        }
        
        .waveform-mini {
            flex: 1;
            height: 40px;
            background: #000;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }
        .bar { width: 3px; background: #0077ff; height: 10px; }

    </style>
</head>
<body>
    <div class="nav-rail">
        <div class="icon-btn active">📡</div>
        <div class="icon-btn">🌍</div>
        <div class="icon-btn">⚙️</div>
    </div>

    <div class="main-stage">
        <div class="globe-wireframe"></div>
        <div class="orbit-path">
            <div class="satellite"></div>
        </div>
        <div style="position: absolute; top: 20px; left: 20px; font-family: monospace; color: #0077ff;">
            ORBIT: LEO<br>
            INC: 45.2°<br>
            ALT: 420km
        </div>
    </div>

    <div class="info-panel">
        <div class="panel-header">
            <h2>SAT-LINK ALPHA</h2>
            <div style="font-size: 12px; color: #888;">STATUS: CONNECTED</div>
        </div>

        <div class="data-row">
            <span class="label">Uplink</span>
            <span class="value">42.5 MBps</span>
        </div>
        <div class="data-row">
            <span class="label">Downlink</span>
            <span class="value">108.2 MBps</span>
        </div>
        <div class="data-row">
            <span class="label">Latency</span>
            <span class="value">124 ms</span>
        </div>

        <div class="terminal">
            > Initializing Handshake...<br>
            > Auth Token: VALID<br>
            > Secure Tunnel Established.<br>
            > Waiting for command input...<br>
            <span style="animation: blink 1s infinite">_</span>
        </div>

        <div class="mic-interface">
            <button class="icon-btn" style="background: #0077ff; color: #fff;">🎤</button>
            <div class="waveform-mini">
                <div class="bar" style="height: 15px"></div>
                <div class="bar" style="height: 25px"></div>
                <div class="bar" style="height: 10px"></div>
                <div class="bar" style="height: 30px"></div>
                <div class="bar" style="height: 20px"></div>
            </div>
        </div>
    </div>
</body>
</html>
