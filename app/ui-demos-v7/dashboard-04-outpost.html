<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Outpost</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;700&display=swap');

        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Chivo Mono', monospace;
            margin: 0;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 60px 1fr 1fr;
            gap: 15px;
            height: 100%;
        }

        .header {
            grid-column: 1 / -1;
            background: #1f1f1f;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 20px;
            font-weight: bold;
            color: #88ff88;
        }

        .widget {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .widget-title {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        .large-status {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            margin-top: auto;
        }

        .map-widget {
            grid-column: span 2;
            grid-row: span 2;
            background-image: radial-gradient(#333 1px, transparent 1px);
            background-size: 20px 20px;
            background-color: #161616;
            position: relative;
        }

        .node {
            width: 10px; height: 10px;
            background: #666;
            border-radius: 50%;
            position: absolute;
        }
        
        .node.active { background: #88ff88; box-shadow: 0 0 10px #88ff88; }
        .node.offline { background: #ff4444; }

        .chat-log {
            font-size: 12px;
            color: #aaa;
            overflow-y: auto;
            flex: 1;
        }

        .input-bar {
            margin-top: 10px;
            border-top: 1px solid #333;
            padding-top: 10px;
            display: flex;
            gap: 10px;
        }

        .mic-btn {
            background: #333;
            border: none;
            color: #fff;
            padding: 5px 10px;
            cursor: pointer;
        }
        .mic-btn:hover { background: #444; }

    </style>
</head>
<body>
    <div class="grid-container">
        <div class="header">
            <span>OUTPOST NETWORK MONITOR</span>
            <span style="margin-left: auto;">ONLINE: 4/5</span>
        </div>

        <div class="widget map-widget">
            <div class="widget-title">Regional Status Map</div>
            <!-- Nodes -->
            <div class="node active" style="top: 20%; left: 30%"></div>
            <div class="node active" style="top: 50%; left: 50%"></div>
            <div class="node offline" style="top: 70%; left: 20%"></div>
            <div class="node active" style="top: 40%; left: 70%"></div>
            <div class="node active" style="top: 80%; left: 80%"></div>
            
            <div style="position: absolute; bottom: 20px; left: 20px; font-size: 12px;">
                <span style="color: #ff4444">●</span> OUTPOST 3 UNRESPONSIVE
            </div>
        </div>

        <div class="widget">
            <div class="widget-title">Environment</div>
            <div class="large-status">22°C</div>
            <div style="font-size: 14px; color: #888;">Radiation: Low</div>
        </div>

        <div class="widget">
            <div class="widget-title">Power Grid</div>
            <div class="large-status" style="color: #ffaa44;">78%</div>
            <div style="font-size: 14px; color: #888;">Running on Generator 2</div>
        </div>

        <div class="widget">
            <div class="widget-title">Comms Log</div>
            <div class="chat-log">
                [10:00] OP-1: Check in.<br>
                [10:05] OP-2: All clear.<br>
                [10:15] HQ: Update on sector 4?<br>
                [10:16] OP-4: ...<br>
                [10:20] HQ: OP-4 respond.<br>
            </div>
            <div class="input-bar">
                <button class="mic-btn">🎙️ REC</button>
                <div style="flex: 1; border: 1px solid #333; background: #000;"></div>
            </div>
        </div>
    </div>
</body>
</html>
