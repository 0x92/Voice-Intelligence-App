<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Scavenger PDA</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap');

        body {
            background-color: #2b2b2b;
            font-family: 'Courier Prime', monospace;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pda-case {
            width: 320px;
            height: 550px;
            background: #555;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 10px 10px 20px rgba(0,0,0,0.5);
            border: 4px solid #333;
            position: relative;
        }

        /* Duct tape fix */
        .tape {
            position: absolute;
            width: 100px; height: 30px;
            background: #ccc;
            transform: rotate(-30deg);
            top: 50px; left: -20px;
            opacity: 0.8;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        .screen {
            background: #7caea0; /* Old LCD green/grey */
            height: 400px;
            border-radius: 5px;
            border: 4px inset #444;
            padding: 10px;
            color: #111;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Broken screen crack */
        .crack {
            position: absolute;
            top: 20px; right: 20px;
            width: 50px; height: 50px;
            border-left: 1px solid rgba(255,255,255,0.4);
            transform: rotate(45deg);
        }

        .header {
            border-bottom: 2px solid #111;
            padding-bottom: 5px;
            margin-bottom: 10px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .note-area {
            flex: 1;
            font-size: 14px;
            line-height: 1.2;
            overflow-y: auto;
        }

        .btn-grid {
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .btn {
            height: 40px;
            background: #222;
            border-radius: 5px;
            border: 1px solid #000;
            box-shadow: inset 0 2px 2px rgba(255,255,255,0.1);
            color: #ccc;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .btn:active { background: #000; transform: translateY(1px); }
        .btn-red { background: #500; color: #fcc; }

        .pixelated-icon {
            font-size: 24px;
            margin-bottom: 10px;
            text-align: center;
        }

    </style>
</head>
<body>
    <div class="pda-case">
        <div class="tape"></div>
        
        <div class="screen">
            <div class="crack"></div>
            <div class="header">
                <span>MEMO_PAD</span>
                <span>BAT: 12%</span>
            </div>
            
            <div class="pixelated-icon">🎙️</div>

            <div class="note-area">
                > Found canned food at the old gas station.<br>
                > Avoid the main highway.<br>
                > RECORDING...<br>
                "Safe house is north. 3 clicks."
            </div>
        </div>

        <div class="btn-grid">
            <div class="btn">MENU</div>
            <div class="btn">MAP</div>
            <div class="btn">LOG</div>
            <div class="btn btn-red">REC</div>
            
            <div class="btn" style="grid-column: span 4;">KEYBOARD_INPUT...</div>
        </div>
    </div>
</body>
</html>
