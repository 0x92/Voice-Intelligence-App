<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Field Radio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&display=swap');

        body {
            background-color: #3a4a3b; /* Army green */
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .radio-face {
            width: 600px;
            height: 350px;
            background: #2a332a;
            border-radius: 10px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            padding: 30px;
            display: grid;
            grid-template-columns: 1fr 200px;
            gap: 20px;
            border: 2px solid #1a221a;
        }

        .speaker-grill {
            background: repeating-linear-gradient(
                45deg,
                #111,
                #111 2px,
                #2a332a 2px,
                #2a332a 4px
            );
            border-radius: 5px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tuner-display {
            background: #e0e8d0;
            height: 60px;
            border-radius: 5px;
            border: 2px solid #000;
            margin-bottom: 20px;
            position: relative;
            font-family: 'Special Elite', cursive;
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-size: 24px;
            color: #333;
        }

        .tuner-line {
            position: absolute;
            left: 40%;
            top: 0; bottom: 0; width: 2px; background: red;
        }

        .knob-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .knob-lg {
            width: 80px; height: 80px;
            background: radial-gradient(#444, #111);
            border-radius: 50%;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
            margin: 0 auto;
        }

        .label {
            text-align: center;
            color: #ccc;
            font-family: sans-serif;
            font-size: 10px;
            text-transform: uppercase;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        .handheld-mic {
            position: absolute;
            right: -100px;
            top: 50px;
            width: 60px;
            height: 150px;
            background: #222;
            border-radius: 10px;
            border: 2px solid #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
        }
        
        .coiled-cord {
            position: absolute;
            bottom: -50px; right: 20px;
            width: 100px; height: 100px;
            border: 5px dashed #000;
            border-radius: 50%;
            clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
            transform: rotate(45deg);
        }

        .led-red {
            width: 10px; height: 10px; background: red; border-radius: 50%;
            box-shadow: 0 0 5px red;
            position: absolute;
            top: 10px; right: 10px;
        }

        .transcription-paper {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: #fff;
            padding: 10px;
            font-family: 'Special Elite', cursive;
            width: 80%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            font-size: 14px;
            transform: rotate(-1deg);
        }

    </style>
</head>
<body>
    <div class="radio-face">
        <div class="speaker-grill">
            <div class="transcription-paper">
                LOG: 0800 HOURS<br>
                "Message received. Extraction point confirmed. Over."
            </div>
        </div>

        <div class="controls-col">
            <div class="tuner-display">
                98.5 MHz
                <div class="tuner-line"></div>
            </div>
            
            <div class="knob-group">
                <div>
                    <div class="knob-lg"></div>
                    <div class="label">Volume</div>
                </div>
                <div>
                    <div class="knob-lg"></div>
                    <div class="label">Tune</div>
                </div>
            </div>

            <div style="margin-top: 20px; text-align: center;">
                <div class="led-red" style="position: relative; display: inline-block; margin-right: 5px;"></div>
                <span style="color: #ccc; font-size: 10px;">TRANSMIT</span>
            </div>
        </div>

        <!-- Decorative mic -->
        <div class="handheld-mic">
            <div style="width: 40px; height: 40px; background: #444; border-radius: 50%; margin-bottom: 20px; border: 1px dotted #888;"></div>
            <div style="width: 20px; height: 40px; background: #500; border-radius: 5px; cursor: pointer;"></div>
        </div>
    </div>
</body>
</html>
