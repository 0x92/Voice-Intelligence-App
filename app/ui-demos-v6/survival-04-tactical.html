<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Tactical HUD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap');

        body {
            background-color: #222;
            background-image: url('https://images.unsplash.com/photo-1596483787711-ac6f0343a42d?q=80&w=2670&auto=format&fit=crop'); /* Night vision goggles background placeholder */
            background-size: cover;
            background-position: center;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            /* Night Vision Filter */
            filter: sepia(100%) hue-rotate(50deg) saturate(300%) contrast(1.2);
        }

        /* Scan lines overlay */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.1) 50%, rgba(0,0,0,0) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
        }

        /* Binocular Mask */
        body::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 30% 50%, transparent 20%, #000 45%),
                        radial-gradient(circle at 70% 50%, transparent 20%, #000 45%);
            pointer-events: none;
            z-index: 50;
        }

        .hud-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 60;
            color: rgba(200, 255, 200, 0.9);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(200, 255, 200, 0.8);
        }

        .compass {
            width: 400px;
            height: 30px;
            border-bottom: 2px solid rgba(200, 255, 200, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-bottom: 5px;
            font-size: 14px;
        }

        .center-reticle {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 50px; height: 50px;
            border: 2px solid rgba(200, 255, 200, 0.6);
            border-radius: 50%;
            display: grid;
            place-items: center;
        }
        
        .center-reticle::before { content: '+'; font-size: 20px; }

        .waveform-box {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            text-align: center;
        }

        .wave-bars {
            display: flex;
            gap: 2px;
            justify-content: center;
            height: 40px;
            align-items: flex-end;
        }

        .bar {
            width: 5px;
            background: rgba(200, 255, 200, 0.8);
            animation: bounce 0.5s infinite alternate;
        }

        @keyframes bounce { from { height: 5px; } to { height: 30px; } }

        .info-panel {
            font-size: 14px;
            line-height: 1.4;
            background: rgba(0, 20, 0, 0.5);
            padding: 10px;
            border-left: 2px solid rgba(200, 255, 200, 0.8);
        }

    </style>
</head>
<body>
    <div class="hud-overlay">
        <div class="top-bar">
            <div>NVG-04 ACTIVE</div>
            <div class="compass">
                <span>NW</span><span>N</span><span>NE</span>
            </div>
            <div>BATT 82%</div>
        </div>

        <div class="center-reticle"></div>

        <div class="waveform-box">
            <div style="font-size: 12px; margin-bottom: 5px;">AUDIO CAPTURE</div>
            <div class="wave-bars">
                <div class="bar" style="animation-delay: 0s"></div>
                <div class="bar" style="animation-delay: 0.1s"></div>
                <div class="bar" style="animation-delay: 0.2s"></div>
                <div class="bar" style="animation-delay: 0.3s"></div>
                <div class="bar" style="animation-delay: 0.4s"></div>
                <div class="bar" style="animation-delay: 0.5s"></div>
                <div class="bar" style="animation-delay: 0.2s"></div>
                <div class="bar" style="animation-delay: 0.1s"></div>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: flex-end;">
            <div class="info-panel">
                OBJ: PATROL SECTOR 4<br>
                DIST: 400m<br>
                TEAM: ALPHA
            </div>
            <div style="text-align: right;" class="info-panel">
                GPS: 34.0522 N, 118.2437 W<br>
                TEMP: 18°C<br>
                WIND: 5km/h N
            </div>
        </div>
    </div>
</body>
</html>
