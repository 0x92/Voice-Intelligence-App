<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Geiger</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap');

        body {
            background-color: #222;
            color: #000;
            font-family: sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .device {
            width: 400px;
            height: 600px;
            background: #f4c430; /* Saffron Yellow */
            border-radius: 20px;
            padding: 30px;
            box-shadow: 10px 10px 30px rgba(0,0,0,0.5);
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid #d4a410;
        }

        /* Scratches / Grime */
        .device::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.3'/%3E%3C/svg%3E");
            opacity: 0.4;
            pointer-events: none;
            mix-blend-mode: multiply;
            border-radius: 20px;
        }

        .meter-window {
            height: 200px;
            background: #eec;
            border: 4px solid #333;
            border-radius: 10px 10px 50% 50% / 10px 10px 20% 20%;
            position: relative;
            margin-bottom: 30px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
        }

        .scale {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            height: 100px;
            border-top: 2px solid #000;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
        }
        
        .needle {
            position: absolute;
            bottom: 20px;
            left: 50%;
            width: 4px;
            height: 140px;
            background: #cc0000;
            transform-origin: bottom center;
            transform: rotate(-45deg);
            animation: jitter 0.2s infinite;
            z-index: 10;
        }

        @keyframes jitter {
            0% { transform: rotate(-45deg); }
            50% { transform: rotate(-40deg); }
            100% { transform: rotate(-48deg); }
        }

        .grill {
            flex: 1;
            background: repeating-linear-gradient(
                90deg,
                #333,
                #333 10px,
                #222 10px,
                #222 20px
            );
            border-radius: 10px;
            border: 4px solid #333;
            margin-bottom: 20px;
            position: relative;
            display: grid;
            place-items: center;
        }
        
        .digital-readout {
            background: #333;
            color: #f00;
            font-family: 'Courier New', monospace;
            padding: 5px 10px;
            font-size: 24px;
            border: 2px solid #000;
            font-weight: bold;
        }

        .controls {
            display: flex;
            justify-content: space-around;
        }

        .knob {
            width: 60px; height: 60px;
            background: #111;
            border-radius: 50%;
            border: 2px solid #555;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
            position: relative;
        }
        .knob::after {
            content: '';
            position: absolute;
            top: 5px; left: 50%; width: 4px; height: 20px; background: #fff; transform: translateX(-50%);
        }

        .brand {
            font-family: 'Black Ops One', cursive;
            position: absolute;
            top: 20px; left: 20px;
            font-size: 18px;
            opacity: 0.7;
        }

    </style>
</head>
<body>
    <div class="device">
        <div class="brand">CIVIL DEFENSE<br>MODEL V-10</div>
        
        <div class="meter-window">
            <div class="scale"></div>
            <div class="needle"></div>
            <div style="position: absolute; bottom: 50px; left: 0; right: 0; text-align: center; font-size: 12px; font-weight: bold;">MICRO-SIEVERTS / HR</div>
        </div>

        <div class="grill">
            <div class="digital-readout">0.14 µSv</div>
        </div>

        <div class="controls">
            <div class="knob" style="transform: rotate(-30deg);"></div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button style="background: red; border: 2px solid #500; color: white; padding: 10px; font-weight: bold; cursor: pointer;">TEST</button>
                <div style="font-size: 10px; text-align: center; font-weight: bold;">BATTERY OK</div>
            </div>
            <div class="knob" style="transform: rotate(60deg);"></div>
        </div>
    </div>
</body>
</html>
