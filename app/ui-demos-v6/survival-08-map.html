<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Map</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap');

        body {
            background-color: #3e3a36;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .map-paper {
            width: 800px;
            height: 600px;
            background: #e6dcc3;
            box-shadow: 10px 10px 30px rgba(0,0,0,0.5);
            position: relative;
            transform: rotate(-2deg);
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/World_map_blank_without_borders.svg/2000px-World_map_blank_without_borders.svg.png');
            background-size: cover;
            background-position: center;
            opacity: 0.9;
        }
        
        /* Fold lines */
        .fold {
            position: absolute;
            top: 0; bottom: 0; width: 1px;
            background: rgba(0,0,0,0.1);
        }
        .f1 { left: 25%; } .f2 { left: 50%; } .f3 { left: 75%; }

        /* Coffee stain */
        .stain {
            position: absolute;
            top: 50px; right: 50px;
            width: 100px; height: 100px;
            border-radius: 50%;
            border: 5px solid rgba(101, 67, 33, 0.2);
            filter: blur(2px);
        }

        .marker-x {
            font-family: 'Permanent Marker', cursive;
            color: #d00;
            font-size: 40px;
            position: absolute;
            top: 40%; left: 30%;
        }

        .note-card {
            position: absolute;
            bottom: 40px; left: 40px;
            width: 300px;
            background: #fff;
            padding: 15px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
            transform: rotate(3deg);
            font-family: 'Permanent Marker', cursive;
            color: #333;
        }

        .tape {
            position: absolute;
            top: -15px; left: 50%; transform: translateX(-50%);
            width: 60px; height: 20px; background: rgba(255, 255, 255, 0.5); border: 1px solid #ccc;
        }

        .compass-rose {
            position: absolute;
            top: 40px; left: 40px;
            font-size: 40px;
            opacity: 0.5;
        }

        .btn-record {
            position: absolute;
            bottom: 20px; right: 20px;
            width: 60px; height: 60px;
            background: #d00;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            border: none;
            cursor: pointer;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.4);
        }

    </style>
</head>
<body>
    <div class="map-paper">
        <div class="fold f1"></div>
        <div class="fold f2"></div>
        <div class="fold f3"></div>
        <div class="stain"></div>
        
        <div class="compass-rose">N</div>
        
        <div class="marker-x">X</div>
        <div style="position: absolute; top: 46%; left: 32%; font-family: 'Permanent Marker'; font-size: 14px; color: #d00;">SUPPLIES</div>

        <div class="note-card">
            <div class="tape"></div>
            Survivor Log #42:<br>
            "We heard voices near the river. Need to record everything from now on."
        </div>

        <button class="btn-record">🎙️</button>
    </div>
</body>
</html>
