<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Pip-Boy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        body {
            background-color: #1a1a1a;
            color: #1aff1a; /* Pip-Boy Green */
            font-family: 'VT323', monospace;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .pip-boy-case {
            width: 700px;
            height: 500px;
            background: #3e3e3e;
            border-radius: 20px;
            padding: 30px;
            box-shadow: inset 0 0 50px #000, 0 20px 50px #000;
            position: relative;
            border: 2px solid #555;
        }

        .screen-bezel {
            background: #111;
            padding: 20px;
            border-radius: 10px;
            height: 100%;
            box-sizing: border-box;
            box-shadow: inset 0 0 20px #000;
        }

        .screen {
            background: #051505;
            height: 100%;
            border-radius: 40px / 10px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* CRT Scanlines */
        .screen::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }
        
        /* Green Glow */
        .screen::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, transparent 50%, rgba(0, 20, 0, 0.8) 100%);
            pointer-events: none;
            z-index: 11;
        }

        .header-tabs {
            display: flex;
            justify-content: space-around;
            border-bottom: 2px solid #1aff1a;
            padding: 10px;
            font-size: 24px;
        }
        .tab { opacity: 0.5; }
        .tab.active { opacity: 1; text-shadow: 0 0 5px #1aff1a; }

        .content {
            padding: 20px;
            flex: 1;
            display: flex;
            gap: 20px;
        }

        .vault-boy {
            width: 150px;
            height: 200px;
            border: 2px solid #1aff1a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .stats-list {
            flex: 1;
            font-size: 20px;
            line-height: 1.5;
        }

        .bar-container {
            width: 100%;
            height: 20px;
            border: 2px solid #1aff1a;
            margin-top: 5px;
            padding: 2px;
        }
        .bar-fill {
            height: 100%;
            background: #1aff1a;
            width: 60%;
            box-shadow: 0 0 5px #1aff1a;
        }

        .footer {
            border-top: 2px solid #1aff1a;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
        }

        .knob {
            position: absolute;
            right: -20px;
            top: 100px;
            width: 40px; height: 40px;
            background: #555;
            border-radius: 5px;
            border: 2px solid #222;
        }

    </style>
</head>
<body>
    <div class="pip-boy-case">
        <div class="knob" style="top: 150px"></div>
        <div class="knob" style="top: 220px"></div>

        <div class="screen-bezel">
            <div class="screen">
                <div class="header-tabs">
                    <div class="tab">STAT</div>
                    <div class="tab">INV</div>
                    <div class="tab active">DATA</div>
                    <div class="tab">MAP</div>
                    <div class="tab">RADIO</div>
                </div>

                <div class="content">
                    <div class="vault-boy">
                        (-_•)👍
                    </div>
                    <div class="stats-list">
                        <div>AUDIO INPUT LVL</div>
                        <div class="bar-container">
                            <div class="bar-fill" style="width: 75%"></div>
                        </div>
                        <br>
                        <div>RADIATION: <span style="animation: blink 1s infinite">0 RADS</span></div>
                        <div>STATUS: RECORDING</div>
                    </div>
                </div>

                <div class="footer">
                    <div>HP 95/100</div>
                    <div>AP 80/100</div>
                    <div>LVL 14</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
