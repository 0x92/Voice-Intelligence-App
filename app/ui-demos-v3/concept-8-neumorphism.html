<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Neumorphism</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap');

        :root {
            --bg: #e0e5ec;
            --text: #4a5568;
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
            --accent: #6d5dfc;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Nunito', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            width: 400px;
            padding: 40px;
            border-radius: 30px;
            background: var(--bg);
            box-shadow: 20px 20px 60px var(--shadow-dark), 
                       -20px -20px 60px var(--shadow-light);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            margin-bottom: 30px;
            color: var(--text);
            font-weight: 700;
        }

        .mic-container {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            box-shadow: inset 10px 10px 20px var(--shadow-dark), 
                       inset -10px -10px 20px var(--shadow-light);
            margin-bottom: 40px;
            position: relative;
        }

        .mic-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: none;
            background: var(--bg);
            box-shadow: 10px 10px 20px var(--shadow-dark), 
                       -10px -10px 20px var(--shadow-light);
            color: var(--accent);
            font-size: 32px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: grid;
            place-items: center;
        }

        .mic-btn:active {
            box-shadow: inset 10px 10px 20px var(--shadow-dark), 
                       inset -10px -10px 20px var(--shadow-light);
            transform: scale(0.95);
        }

        .status {
            font-size: 14px;
            color: var(--accent);
            margin-bottom: 30px;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 20px;
            width: 100%;
            justify-content: center;
        }

        .btn-small {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            border: none;
            background: var(--bg);
            box-shadow: 6px 6px 12px var(--shadow-dark), 
                       -6px -6px 12px var(--shadow-light);
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-small:hover {
            transform: translateY(-2px);
        }

        .btn-small:active {
            box-shadow: inset 4px 4px 8px var(--shadow-dark), 
                       inset -4px -4px 8px var(--shadow-light);
            transform: translateY(0);
        }

        /* Waves animation inside mic container (simulated) */
        .wave {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--accent);
            opacity: 0;
            animation: ripple 2s infinite;
        }

        @keyframes ripple {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }

    </style>
</head>
<body>
    <div class="container">
        <h2>Soft Voice</h2>
        
        <div class="mic-container">
            <div class="wave"></div>
            <button class="mic-btn">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
            </button>
        </div>

        <div class="status">Ready to listen</div>

        <div class="controls">
            <button class="btn-small" title="Settings">⚙️</button>
            <button class="btn-small" title="History">📁</button>
            <button class="btn-small" title="Share">🔗</button>
        </div>
    </div>
</body>
</html>
