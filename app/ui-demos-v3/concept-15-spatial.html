<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Spatial</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap');

        body {
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Inter', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        .glass-panel {
            width: 800px;
            height: 500px;
            background: rgba(220, 220, 220, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.4);
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            padding: 40px;
            display: flex;
            gap: 40px;
            transform: rotateX(5deg) scale(0.95);
            transition: transform 0.5s ease;
        }

        .glass-panel:hover {
            transform: rotateX(0deg) scale(1);
        }

        .sidebar {
            width: 200px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-item {
            padding: 15px 20px;
            border-radius: 20px;
            color: #000;
            font-size: 16px;
            font-weight: 500;
            transition: background 0.3s;
            cursor: pointer;
        }

        .menu-item:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .menu-item.active {
            background: rgba(255,255,255,0.5);
        }

        .main-content {
            flex: 1;
            background: rgba(255,255,255,0.5);
            border-radius: 30px;
            padding: 30px;
            box-shadow: inset 0 2px 10px rgba(255,255,255,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .orb {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff, #a1c4fd, #c2e9fb);
            box-shadow: 0 10px 30px rgba(161, 196, 253, 0.6);
            margin-bottom: 30px;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        h2 {
            margin: 0 0 10px 0;
            font-weight: 400;
            font-size: 28px;
        }

        p {
            margin: 0;
            color: #444;
            text-align: center;
            max-width: 80%;
        }

        .toolbar {
            position: absolute;
            bottom: -80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(50, 50, 50, 0.8);
            backdrop-filter: blur(20px);
            padding: 15px 30px;
            border-radius: 50px;
            display: flex;
            gap: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .tool-icon {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .tool-icon:hover {
            transform: scale(1.2);
            background: #fff;
        }

    </style>
</head>
<body>
    <div class="glass-panel">
        <div class="sidebar">
            <div class="menu-item active">Immersive</div>
            <div class="menu-item">Passthrough</div>
            <div class="menu-item">Shared Space</div>
        </div>
        
        <div class="main-content">
            <div class="orb"></div>
            <h2>Listening...</h2>
            <p>Look at the orb and speak clearly to begin interacting with the system.</p>
        </div>

        <div class="toolbar">
            <div class="tool-icon"></div>
            <div class="tool-icon"></div>
            <div class="tool-icon"></div>
            <div class="tool-icon"></div>
        </div>
    </div>
</body>
</html>
