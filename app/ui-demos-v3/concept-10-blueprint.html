<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Blueprint</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');

        :root {
            --blue-bg: #0044cc;
            --line: rgba(255, 255, 255, 0.4);
            --text: #ffffff;
        }

        body {
            background-color: var(--blue-bg);
            background-image: 
                linear-gradient(var(--line) 1px, transparent 1px),
                linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text);
            font-family: 'Courier Prime', monospace;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .canvas {
            width: 90%;
            height: 80%;
            border: 4px solid #fff;
            position: relative;
            padding: 40px;
            box-shadow: 0 0 0 10px var(--blue-bg), 0 0 0 12px #fff;
        }

        .title-block {
            position: absolute;
            bottom: 20px;
            right: 20px;
            border: 2px solid #fff;
            padding: 10px 20px;
            background: var(--blue-bg);
            text-align: right;
        }

        .title-block h1 {
            margin: 0;
            font-size: 18px;
            text-transform: uppercase;
        }
        
        .title-block .meta {
            font-size: 12px;
            margin-top: 5px;
            opacity: 0.8;
        }

        .measurements {
            position: absolute;
            top: 20px;
            left: 20px;
            border-bottom: 1px solid #fff;
            padding-bottom: 5px;
        }

        .content {
            border: 1px dashed rgba(255,255,255,0.5);
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Technical rulers */
        .ruler-top {
            position: absolute;
            top: 0; left: 0; right: 0; height: 10px;
            background: url('data:image/svg+xml;utf8,<svg width="10" height="10" xmlns="http://www.w3.org/2000/svg"><line x1="0" y1="0" x2="0" y2="10" stroke="white" stroke-width="1"/></svg>') repeat-x;
        }
        .ruler-left {
            position: absolute;
            top: 0; left: 0; bottom: 0; width: 10px;
            background: url('data:image/svg+xml;utf8,<svg width="10" height="10" xmlns="http://www.w3.org/2000/svg"><line x1="0" y1="0" x2="10" y2="0" stroke="white" stroke-width="1"/></svg>') repeat-y;
        }

        .mic-schematic {
            width: 120px;
            height: 120px;
            border: 2px solid #fff;
            border-radius: 50%;
            display: grid;
            place-items: center;
            position: relative;
        }
        
        .mic-schematic::after {
            content: '';
            position: absolute;
            top: 50%; left: -20px; right: -20px; height: 1px; background: #fff;
        }
        .mic-schematic::before {
            content: '';
            position: absolute;
            left: 50%; top: -20px; bottom: -20px; width: 1px; background: #fff;
        }

        .label {
            background: var(--blue-bg);
            padding: 2px 5px;
            position: relative;
            z-index: 1;
            font-size: 14px;
        }

        .btn-tech {
            margin-top: 40px;
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            font-family: inherit;
            font-weight: bold;
            padding: 10px 20px;
            cursor: pointer;
            text-transform: uppercase;
        }
        
        .btn-tech:hover {
            background: #fff;
            color: var(--blue-bg);
        }

        .dimension-line {
            position: absolute;
            right: -30px; top: 0; bottom: 0; width: 20px;
            border-left: 1px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dimension-text {
            transform: rotate(90deg);
            white-space: nowrap;
            font-size: 10px;
        }

    </style>
</head>
<body>
    <div class="canvas">
        <div class="ruler-top"></div>
        <div class="ruler-left"></div>
        
        <div class="measurements">
            SCALE: 1:1<br>
            UNIT: MM
        </div>

        <div class="content">
            <div class="dimension-line">
                <div class="dimension-text">HEIGHT = 500</div>
            </div>

            <div class="mic-schematic">
                <span class="label">FIG. A</span>
            </div>
            
            <div style="margin-top: 20px; text-align: center;">
                <p>INPUT_MODULE_V1</p>
                <button class="btn-tech">INITIALIZE</button>
            </div>
        </div>

        <div class="title-block">
            <h1>Project: Voice_Arch</h1>
            <div class="meta">
                DWG NO. 42-A<br>
                APPROVED BY: ADMIN
            </div>
        </div>
    </div>
</body>
</html>
