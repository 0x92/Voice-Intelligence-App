<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Intel - Editorial</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap');

        body {
            background-color: #fcfbf9;
            color: #1a1a1a;
            font-family: 'Lato', sans-serif;
            margin: 0;
            height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
        }

        .visual-col {
            position: relative;
            background: #e8e6e1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .visual-col img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
            filter: grayscale(20%) sepia(10%);
        }

        .overlay-text {
            position: absolute;
            bottom: 40px;
            left: 40px;
            font-family: 'Playfair Display', serif;
            font-size: 64px;
            line-height: 0.9;
            color: #fff;
            mix-blend-mode: difference;
        }

        .content-col {
            padding: 80px 60px;
            display: flex;
            flex-direction: column;
        }

        .date {
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 1px solid #000;
            padding-bottom: 10px;
            margin-bottom: 40px;
            display: inline-block;
            width: 100px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            font-weight: 400;
            margin: 0 0 30px 0;
            font-style: italic;
        }

        .transcription-preview {
            font-size: 20px;
            line-height: 1.6;
            color: #444;
            flex: 1;
            border-left: 2px solid #1a1a1a;
            padding-left: 30px;
            margin-bottom: 40px;
        }

        .controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .record-btn {
            background: #1a1a1a;
            color: #fff;
            border: none;
            padding: 20px 40px;
            font-family: 'Lato', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .record-btn:hover {
            background: #333;
        }

        .secondary-btn {
            background: transparent;
            border: 1px solid #1a1a1a;
            color: #1a1a1a;
            padding: 19px 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 14px;
            cursor: pointer;
        }

        @media (max-width: 900px) {
            body { grid-template-columns: 1fr; }
            .visual-col { display: none; }
        }
    </style>
</head>
<body>
    <div class="visual-col">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=1964&auto=format&fit=crop" alt="Portrait">
        <div class="overlay-text">
            The<br>Voice<br>Issue
        </div>
    </div>
    <div class="content-col">
        <div class="date">Oct 24</div>
        <h1>Narrative<br>Intelligence</h1>
        
        <div class="transcription-preview">
            "Fashion is not something that exists in dresses only. Fashion is in the sky, in the street, fashion has to do with ideas, the way we live, what is happening..."
        </div>

        <div class="controls">
            <button class="record-btn">Record Story</button>
            <button class="secondary-btn">Archive</button>
        </div>
    </div>
</body>
</html>
